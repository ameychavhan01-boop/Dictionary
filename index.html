'trend': { t:`Trend`, lv:'B', al:[`trend`,`uptrend`,`downtrend`,`sideways`,`range-bound`],
  s:`The general direction price is moving — up, down or sideways.`,
  ex:[`An **uptrend** makes higher highs and higher lows. A **downtrend** makes lower highs and lower lows. **Sideways** (range) means price moves between two levels without direction.`,
      `"The trend is your friend" — trading with the trend has higher odds than fighting it. Markets spend a lot of time sideways, which is where many trend traders lose money.`],
  dg:'trend',
  use:[`In an uptrend, buy pullbacks to support or moving averages.`,`In a range, buy near support and sell near resistance — or stay out.`],
  mis:[`Trying to catch the exact top or bottom against a strong trend.`],
  key:[`Up = HH + HL. Down = LH + LL.`,`Trade with the trend.`,`Sideways markets need a different approach.`],
  rel:['market-structure','trendline','moving-average','sr'],
  q:[[`An uptrend makes…`,[`Lower highs, lower lows`,`Higher highs, higher lows`],1,`Rising peaks and rising dips.`]] },

'sr': { t:`Support & Resistance`, lv:'B', al:[`support`,`resistance`,`support and resistance`,`S&R`,`key level`,`role reversal`],
  s:`Support is a price floor where buyers step in. Resistance is a ceiling where sellers step in.`,
  ex:[`At support, demand is strong enough to stop a fall. At resistance, supply is strong enough to stop a rise. These levels form because traders remember past prices.`,
      `When resistance is broken, it often becomes new support (role reversal), and broken support often becomes resistance. The more times a level is tested, the more important it is — but also the more likely it eventually breaks.`],
  dg:'sr',
  use:[`Buy near support with a stop just below it; sell or book profit near resistance.`,`Treat levels as zones, not exact lines.`],
  mis:[`Drawing too many lines.`,`Placing stops exactly at the level, where everyone else has theirs.`],
  key:[`Support = floor. Resistance = ceiling.`,`Broken resistance → new support.`,`Use zones, not thin lines.`],
  rel:['trendline','breakout','supply-demand','volume-profile'],
  q:[[`After price breaks above resistance, that level often becomes…`,[`Support`,`Nothing`],0,`Role reversal: old resistance becomes new support.`]] },

'trendline': { t:`Trendlines & Channels`, lv:'B', al:[`trendline`,`trend line`,`channel`,`trend channel`],
  s:`A straight line drawn through the lows of an uptrend (or highs of a downtrend) to show its direction and support.`,
  ex:[`In an uptrend, join two or more rising lows. In a downtrend, join two or more falling highs. A third touch confirms the line.`,
      `A parallel line on the other side creates a channel. Price often moves between the two lines. A clean break of the trendline can warn that the trend is weakening.`],
  dg:'trendline',
  use:[`Buy near a rising trendline in an uptrend.`,`Watch for a break and retest as an early trend-change signal.`],
  mis:[`Forcing a line through candles to make it "fit".`],
  key:[`Needs at least 2 points; 3 confirms.`,`Uptrend line = support.`,`Break = possible trend change.`],
  rel:['trend','sr','triangles'],
  q:[[`An uptrend line is drawn through…`,[`Higher lows`,`Lower highs`],0,`It connects the rising lows.`]] },

'moving-average': { t:`Moving Average (SMA & EMA)`, lv:'B', al:[`moving average`,`moving averages`,`SMA`,`EMA`,`200 DMA`,`DMA`,`golden cross`,`death cross`],
  s:`The average closing price over the last N candles, drawn as a smooth line to show trend.`,
  ex:[`A **Simple Moving Average (SMA)** gives equal weight to each price. An **Exponential Moving Average (EMA)** gives more weight to recent prices, so it reacts faster.`,
      `Popular settings: 20 (short-term), 50 (medium) and 200 (long-term trend). Price above the 200-day average is generally seen as a long-term uptrend. A **golden cross** is when the 50 crosses above the 200; a **death cross** is the opposite.`],
  dg:'ma',
  f:`SMA = (Sum of last N closes) ÷ N`,
  eg:[`Closes of last 5 days: 100, 102, 101, 104, 103 → 5-day SMA = 510 ÷ 5 = 102.`],
  use:[`Use a rising 20 or 50 EMA as dynamic support in uptrends.`,`Use the 200 average to decide whether to look for buys or sells.`],
  mis:[`Trading every crossover in a sideways market — many false signals.`],
  key:[`MA smooths price to show trend.`,`EMA reacts faster than SMA.`,`200 = long-term trend filter.`],
  rel:['trend','macd','bollinger','vwap'],
  q:[[`Which reacts faster to new prices?`,[`SMA`,`EMA`],1,`EMA weights recent prices more.`],[`Closes 10, 12, 14. 3-period SMA?`,[`12`,`14`,`36`],0,`(10+12+14) ÷ 3 = 12.`]] },

'rsi': { t:`RSI`, lv:'B', ff:`Relative Strength Index`, al:[`RSI`,`relative strength index`,`overbought`,`oversold`,`momentum`],
  s:`A momentum indicator from 0 to 100 that shows how strong recent buying or selling has been.`,
  ex:[`RSI (made by J. Welles Wilder, usually 14 periods) compares the size of recent gains with recent losses. Above 70 is called **overbought**; below 30 is called **oversold**.`,
      `Important: in a strong uptrend RSI can stay above 70 for a long time — overbought does not mean "sell now". Many traders use RSI 50 as a trend filter (above 50 = bullish momentum), and look for divergence for reversals.`],
  dg:'rsi',
  f:`RSI = 100 − 100 ÷ (1 + RS)\nRS = Average Gain ÷ Average Loss (over 14 periods)`,
  tb:{h:[`RSI`,`Common reading`],r:[[`Above 70`,`Overbought — strong buying, may pause`],[`50 – 70`,`Bullish momentum`],[`30 – 50`,`Bearish momentum`],[`Below 30`,`Oversold — strong selling, may bounce`]]},
  use:[`Buy pullbacks in an uptrend when RSI dips to 40–50 and turns up.`,`Watch for divergence between price and RSI.`],
  mis:[`Shorting just because RSI is above 70 in a strong uptrend.`],
  key:[`0–100 scale.`,`70 / 30 = overbought / oversold.`,`Strong trends can stay overbought.`],
  rel:['divergence','macd','moving-average'],
  q:[[`RSI of 25 is usually called…`,[`Overbought`,`Oversold`],1,`Below 30 = oversold.`],[`RSI above 70 always means sell?`,[`Yes`,`No`],1,`In strong trends RSI stays high for long.`]] },

'macd': { t:`MACD`, lv:'I', ff:`Moving Average Convergence Divergence`, al:[`MACD`,`signal line`,`histogram`],
  s:`An indicator made from two EMAs that shows trend direction and momentum.`,
  ex:[`The **MACD line** = 12 EMA − 26 EMA. The **signal line** = 9 EMA of the MACD line. The **histogram** shows the gap between them.`,
      `MACD crossing above the signal line is a bullish signal; crossing below is bearish. MACD above zero means the short-term average is above the long-term one — an uptrend.`],
  dg:'macd',
  f:`MACD Line = EMA(12) − EMA(26)\nSignal Line = EMA(9) of MACD Line\nHistogram = MACD Line − Signal Line`,
  use:[`Take crossovers only in the direction of the bigger trend.`,`A shrinking histogram warns that momentum is fading.`],
  mis:[`Using MACD crossovers alone in sideways markets.`],
  key:[`Default settings: 12, 26, 9.`,`Above zero = bullish bias.`,`Histogram = momentum strength.`],
  rel:['moving-average','rsi','divergence'],
  q:[[`MACD line is the difference between…`,[`12 EMA and 26 EMA`,`50 SMA and 200 SMA`],0,`Standard MACD = EMA 12 − EMA 26.`]] },

'bollinger': { t:`Bollinger Bands`, lv:'I', al:[`Bollinger Bands`,`Bollinger`,`squeeze`,`standard deviation`],
  s:`A band around price made of a 20-period average plus and minus 2 standard deviations — it widens and narrows with volatility.`,
  ex:[`The middle band is a 20 SMA. The upper and lower bands are 2 standard deviations away. About 90%+ of the time price stays inside the bands.`,
      `When the bands **squeeze** tight, volatility is low and a big move often follows. In strong trends, price can "walk the band" — riding along the upper or lower band.`],
  dg:'bb',
  f:`Middle = SMA(20)\nUpper = SMA(20) + 2 × Std Dev\nLower = SMA(20) − 2 × Std Dev`,
  use:[`Watch squeezes for upcoming breakouts.`,`In ranges, the bands act like dynamic support and resistance.`],
  mis:[`Selling every touch of the upper band in a strong uptrend.`],
  key:[`Bands widen = volatile. Squeeze = quiet before a move.`,`Touching a band is not a signal by itself.`],
  rel:['moving-average','atr','breakout'],
  q:[[`A Bollinger squeeze usually comes before…`,[`A big move`,`No move at all`],0,`Low volatility is often followed by expansion.`]] },

'vwap': { t:`VWAP`, lv:'I', ff:`Volume Weighted Average Price`, al:[`VWAP`,`volume weighted average price`],
  s:`The average price of the day, weighted by how much volume traded at each price.`,
  ex:[`VWAP resets every morning. It shows the "fair" average price that all buyers and sellers paid today. Big institutions often judge their trades against it.`,
      `Price above VWAP = buyers in control for the day. Price below = sellers in control. Intraday traders use it as dynamic support/resistance.`],
  f:`VWAP = Σ(Price × Volume) ÷ Σ(Volume)\n(Price is usually the typical price = (High + Low + Close) ÷ 3)`,
  eg:[`If 1,000 shares trade at ₹100 and 3,000 at ₹104, VWAP = (1,00,000 + 3,12,000) ÷ 4,000 = ₹103.`],
  use:[`Intraday: buy pullbacks to VWAP when price is above it and trending up.`],
  mis:[`Using day-VWAP on daily or weekly charts — it is an intraday tool (use anchored VWAP instead).`],
  key:[`Resets daily.`,`Above = bullish day. Below = bearish day.`,`Used by institutions as a benchmark.`],
  rel:['volume','moving-average','volume-profile'],
  q:[[`VWAP is mainly used for…`,[`Intraday trading`,`10-year investing`],0,`Standard VWAP resets each day.`]] },

'atr': { t:`ATR`, lv:'I', ff:`Average True Range`, al:[`ATR`,`average true range`,`volatility`],
  s:`Measures how much price usually moves per candle — a gauge of volatility, not direction.`,
  ex:[`ATR (usually 14 periods) averages the "true range" of each candle, which includes gaps. A higher ATR means bigger swings.`,
      `Traders use ATR to set stop-losses that fit the market: too tight and normal noise stops you out; too wide and you risk too much.`],
  f:`True Range = biggest of:\n  High − Low\n  |High − Previous Close|\n  |Low − Previous Close|\nATR = Average of True Range (14)`,
  eg:[`A share's daily ATR is ₹20. A stop 1.5 × ATR away = ₹30 below entry.`],
  use:[`Set stops at 1–2 × ATR from entry.`,`Use ATR to size positions — smaller size when ATR is high.`],
  mis:[`Reading ATR as bullish or bearish — it only shows volatility.`],
  key:[`ATR = average movement.`,`No direction.`,`Great for stops and sizing.`],
  rel:['position-sizing','sl-order','bollinger'],
  q:[[`A rising ATR means…`,[`Price is going up`,`Volatility is increasing`],1,`ATR measures volatility only.`]] },

'volume-profile': { t:`Volume Profile (FRVP)`, lv:'P', ff:`Fixed Range Volume Profile`, al:[`volume profile`,`FRVP`,`POC`,`point of control`,`value area`,`VAH`,`VAL`,`HVN`,`LVN`],
  s:`Shows how much volume traded at each price level — not each time — as horizontal bars on the chart.`,
  ex:[`Normal volume is shown per candle (time). Volume profile shows volume per **price**, so you see where the market did most of its business.`,
      `**POC (Point of Control)** = price with the most volume — a strong magnet. **Value Area** = the range holding about 70% of volume (top = VAH, bottom = VAL). **HVN** (high-volume nodes) act like support/resistance; **LVN** (low-volume nodes) are thin areas price moves through quickly.`,
      `FRVP lets you draw the profile over any range you choose, e.g. from a swing low to a swing high.`],
  dg:'vp',
  tb:{h:[`Term`,`Meaning`,`Use`],r:[[`POC`,`Most traded price`,`Magnet / strong level`],[`VAH / VAL`,`Top / bottom of 70% volume area`,`Range edges`],[`HVN`,`Heavy volume shelf`,`Support / resistance`],[`LVN`,`Thin volume gap`,`Fast moves, possible stop area`]]},
  use:[`Draw FRVP over the last swing; look for longs near VAL/POC in an uptrend.`,`Expect price to move fast through LVNs.`],
  mis:[`Drawing profiles over random ranges with no clear swing.`],
  key:[`Volume by price, not time.`,`POC = magnet.`,`Value area = 70% of volume.`],
  rel:['volume','sr','vwap','supply-demand'],
  q:[[`POC stands for…`,[`Point of Control`,`Price of Candle`],0,`The price level with the highest traded volume.`],[`Price usually moves ___ through low-volume nodes.`,[`Slowly`,`Quickly`],1,`Few orders there, so little resistance.`]] },

'fibonacci': { t:`Fibonacci Retracement`, lv:'I', al:[`Fibonacci`,`Fib`,`retracement`,`61.8%`,`golden ratio`,`golden pocket`],
  s:`Levels (23.6%, 38.2%, 50%, 61.8%) where a pullback might stop before the trend continues.`,
  ex:[`After a big move, price usually pulls back part of the way. Draw the Fib tool from swing low to swing high (in an uptrend) to see likely pullback levels.`,
      `The 50%–61.8% area (sometimes called the "golden pocket") is the most watched. Levels work best when they line up with support, a moving average or volume levels.`],
  dg:'fib',
  tb:{h:[`Level`,`Pullback type`],r:[[`23.6%`,`Very shallow — strong trend`],[`38.2%`,`Healthy pullback`],[`50%`,`Half-way (not a true Fib number, but widely used)`],[`61.8%`,`Deep — last strong level for the trend`]]},
  eg:[`Price rises from ₹100 to ₹200. 61.8% retracement = 200 − (100 × 0.618) = ₹138.20.`],
  use:[`Look for buy signals near 50–61.8% in an uptrend.`,`Use Fib extensions (127%, 161.8%) for targets.`],
  mis:[`Drawing Fib on random small swings.`],
  key:[`Draw low → high in uptrends.`,`50–61.8% = key zone.`,`Stronger with confluence.`],
  rel:['trend','sr','pullback'],
  q:[[`Move ₹50 → ₹150. 50% retracement level?`,[`₹75`,`₹100`,`₹125`],1,`150 − (100 × 0.5) = ₹100.`]] },

'divergence': { t:`Divergence`, lv:'I', al:[`divergence`,`bullish divergence`,`bearish divergence`,`hidden divergence`],
  s:`When price and an indicator (like RSI) move in opposite directions — a warning that the move is weakening.`,
  ex:[`**Bearish divergence:** price makes a higher high but RSI makes a lower high — buyers are losing strength. **Bullish divergence:** price makes a lower low but RSI makes a higher low — sellers are tiring.`,
      `**Hidden divergence** works the other way and signals trend continuation. Divergence is a warning, not an exact entry — wait for price to confirm (like a break of structure).`],
  dg:'div',
  tb:{h:[`Type`,`Price`,`Indicator`,`Signal`],r:[[`Bearish`,`Higher high`,`Lower high`,`Possible top`],[`Bullish`,`Lower low`,`Higher low`,`Possible bottom`],[`Hidden bullish`,`Higher low`,`Lower low`,`Uptrend continues`],[`Hidden bearish`,`Lower high`,`Higher high`,`Downtrend continues`]]},
  use:[`Combine with support/resistance and a confirmation candle.`],
  mis:[`Selling the first bearish divergence in a strong trend — divergence can repeat several times.`],
  key:[`Price and indicator disagree = weakening.`,`Wait for confirmation.`],
  rel:['rsi','macd','bos-choch'],
  q:[[`Price higher high, RSI lower high = …`,[`Bullish divergence`,`Bearish divergence`],1,`Momentum is fading while price rises.`]] },

'head-shoulders': { t:`Head and Shoulders`, lv:'I', al:[`head and shoulders`,`head & shoulders`,`inverse head and shoulders`,`neckline`],
  s:`A reversal pattern with three peaks — the middle one highest — that often marks the end of an uptrend.`,
  ex:[`It shows buyers getting weaker: a high (left shoulder), a higher high (head), then a lower high (right shoulder). The line joining the two dips is the **neckline**.`,
      `A close below the neckline confirms the pattern. A common target is the height from head to neckline, projected down from the break. The **inverse** head and shoulders is the bullish version at a bottom.`],
  dg:'hs',
  f:`Target ≈ Neckline − (Head − Neckline)`,
  eg:[`Head at ₹600, neckline at ₹500 → height ₹100. Break below ₹500 → target near ₹400.`],
  use:[`Wait for a close below the neckline; some traders sell the retest of the neckline.`],
  mis:[`Selling before the neckline breaks — many patterns never complete.`],
  key:[`Three peaks, head highest.`,`Neckline break = confirmation.`,`Inverse version is bullish.`],
  rel:['double-top','sr','trend'],
  q:[[`Head ₹300, neckline ₹250. Target after break?`,[`₹200`,`₹225`,`₹350`],0,`Height 50 → 250 − 50 = ₹200.`]] },

'double-top': { t:`Double Top & Double Bottom`, lv:'B', al:[`double top`,`double bottom`,`M pattern`,`W pattern`],
  s:`Double top = two peaks at the same level (bearish, "M"). Double bottom = two lows at the same level (bullish, "W").`,
  ex:[`In a double top, price fails twice at the same resistance — buyers couldn't push higher. Confirmation comes when price breaks below the dip between the two tops (the neckline).`,
      `A double bottom is the mirror: price holds the same support twice, then breaks above the middle peak.`],
  dg:'dtop',
  use:[`Enter on the neckline break with a stop above the second top.`,`Target ≈ height of the pattern.`],
  mis:[`Calling every two highs a double top before the neckline breaks.`],
  key:[`M = bearish. W = bullish.`,`Neckline break confirms.`],
  rel:['head-shoulders','sr','breakout'],
  q:[[`A "W" shape is a…`,[`Double top`,`Double bottom`],1,`W = double bottom, bullish.`]] },

'triangles': { t:`Triangles`, lv:'I', al:[`triangle`,`triangles`,`ascending triangle`,`descending triangle`,`symmetrical triangle`,`wedge`],
  s:`Price squeezing between two converging lines before breaking out.`,
  ex:[`**Ascending triangle:** flat top, rising lows — usually bullish. **Descending triangle:** flat bottom, falling highs — usually bearish. **Symmetrical triangle:** both lines converge — breaks either way, often in the trend's direction.`,
      `Volume usually falls inside the triangle and jumps on the breakout.`],
  dg:'tri',
  use:[`Trade the breakout with volume; stop inside the triangle.`],
  mis:[`Entering before the breakout and getting caught in a fake move.`],
  key:[`Flat top + rising lows = bullish.`,`Flat bottom + falling highs = bearish.`,`Breakout needs volume.`],
  rel:['breakout','trendline','flags'],
  q:[[`Ascending triangle is usually…`,[`Bullish`,`Bearish`],0,`Buyers keep raising lows into flat resistance.`]] },

'flags': { t:`Flag & Pennant`, lv:'I', al:[`flag`,`bull flag`,`bear flag`,`pennant`],
  s:`Short pauses after a sharp move that usually lead to another move in the same direction.`,
  ex:[`A **flag** has a strong move (the pole), followed by a small channel sloping against it (the flag). A **pennant** is the same idea, but the pause is a small triangle.`,
      `They are continuation patterns — the market "catches its breath" before continuing.`],
  dg:'flag',
  f:`Target ≈ Breakout point + Length of the pole`,
  use:[`Buy the breakout of a bull flag; stop below the flag low.`],
  mis:[`Trading flags that are too deep — a pullback of more than half the pole weakens it.`],
  key:[`Pole + small pause = flag.`,`Continuation pattern.`,`Target = pole length.`],
  rel:['triangles','breakout','trend'],
  q:[[`A bull flag is a ___ pattern.`,[`Reversal`,`Continuation`],1,`The prior uptrend usually continues.`]] }
});

// ===== Price Action =====
Object.assign(C, {
'candlestick': { t:`Candlestick Basics`, lv:'B', al:[`candlestick`,`candlesticks`,`candle`,`candles`,`wick`,`wicks`],
  s:`Each candle shows the open, high, low and close of one period — and who won that period, buyers or sellers.`,
  ex:[`The **body** is the area between open and close. A green (bullish) candle closes higher than it opened; a red (bearish) candle closes lower. The thin lines are **wicks** (shadows) showing the highest and lowest prices reached.`,
      `Long body = strong control by one side. Long upper wick = price was pushed up but sellers rejected it. Long lower wick = sellers pushed down but buyers rejected it. Candlesticks were first used in Japan for rice trading.`],
  dg:'candle',
  tb:{h:[`Candle shape`,`Tells you`],r:[[`Big green body`,`Strong buying`],[`Big red body`,`Strong selling`],[`Long lower wick`,`Buyers rejected lower prices`],[`Long upper wick`,`Sellers rejected higher prices`],[`Tiny body`,`Indecision`]]},
  use:[`Read candles at key levels (support, resistance) — that's where they matter most.`],
  mis:[`Reading every candle in the middle of nowhere — location matters more than shape.`],
  key:[`Body = open to close.`,`Wicks = rejection.`,`Context (where it forms) is everything.`],
  rel:['doji','hammer','engulfing','chart-types'],
  q:[[`A long lower wick shows…`,[`Sellers in full control`,`Buyers rejected lower prices`],1,`Price went down but was pushed back up.`]] },

'doji': { t:`Doji`, lv:'B', al:[`doji`,`dragonfly doji`,`gravestone doji`],
  s:`A candle where open and close are almost the same — it shows indecision between buyers and sellers.`,
  ex:[`A doji looks like a cross or plus sign. Neither side won the period. After a long trend, a doji at a key level can warn that the trend is tiring.`,
      `**Dragonfly doji** (long lower wick) is more bullish at support. **Gravestone doji** (long upper wick) is more bearish at resistance.`],
  dg:['candles',[[50,72,30,50.5,`Doji`],[60,62,18,60.5,`Dragonfly`],[40,82,39.5,40.5,`Gravestone`]]],
  use:[`Wait for the next candle to confirm direction after a doji.`],
  mis:[`Treating a doji as a buy or sell signal by itself.`],
  key:[`Doji = indecision.`,`Matters most after a trend or at a key level.`,`Needs confirmation.`],
  rel:['candlestick','hammer','morning-star'],
  q:[[`A doji's open and close are…`,[`Very far apart`,`Almost equal`],1,`Tiny body = indecision.`]] },

'hammer': { t:`Hammer & Shooting Star`, lv:'B', al:[`hammer`,`shooting star`,`pin bar`,`inverted hammer`,`hanging man`],
  s:`Hammer: small body with a long lower wick at a low — bullish. Shooting star: small body with a long upper wick at a high — bearish.`,
  ex:[`A **hammer** forms after a fall: sellers push price down, but buyers push it back up to close near the high. The lower wick should be at least 2× the body.`,
      `A **shooting star** forms after a rise: buyers push price up, but sellers slam it back down. Together these are often called **pin bars**. The same hammer shape at the top of an uptrend is called a hanging man (bearish warning).`],
  dg:['candles',[[70,72,60,62],[62,64,52,55],[52,56,22,55,`Hammer`],[40,48,38,46],[46,56,44,54],[54,88,52,52.5,`Shooting star`]]],
  use:[`Buy above a hammer's high at support, with a stop below its wick.`,`Sell below a shooting star's low at resistance.`],
  mis:[`Trading hammers in the middle of a range, away from support.`],
  key:[`Long wick = rejection.`,`Hammer at lows = bullish. Shooting star at highs = bearish.`,`Wick ≥ 2× body.`],
  rel:['candlestick','doji','engulfing','sr'],
  q:[[`A shooting star has a long…`,[`Lower wick`,`Upper wick`],1,`Buyers pushed up, sellers rejected — long upper wick.`]] },

'engulfing': { t:`Engulfing Pattern`, lv:'B', al:[`engulfing`,`bullish engulfing`,`bearish engulfing`],
  s:`A two-candle pattern where the second candle's body completely covers the first — a strong reversal signal.`,
  ex:[`**Bullish engulfing:** after a fall, a small red candle is followed by a bigger green candle whose body covers the red one. Buyers took over.`,
      `**Bearish engulfing:** after a rise, a small green candle is followed by a bigger red one covering it. Sellers took over. The bigger the second candle and the more important the level, the stronger the signal.`],
  dg:['candles',[[78,80,68,70],[70,72,60,62],[62,64,54,56,``],[54,74,52,72,`Bullish engulfing`]]],
  use:[`Look for it at support (bullish) or resistance (bearish), with higher volume.`],
  mis:[`Ignoring the trend — an engulfing against a very strong trend often fails.`],
  key:[`Second body covers the first.`,`Bullish at lows, bearish at highs.`,`Stronger with volume and a key level.`],
  rel:['candlestick','morning-star','sr'],
  q:[[`In a bullish engulfing, the second candle is…`,[`Small and red`,`Big and green, covering the first`],1,`Its body engulfs the prior red body.`]] },

'morning-star': { t:`Morning Star & Evening Star`, lv:'I', al:[`morning star`,`evening star`],
  s:`Three-candle reversal patterns: morning star at bottoms (bullish), evening star at tops (bearish).`,
  ex:[`**Morning star:** (1) a big red candle, (2) a small candle showing indecision, (3) a big green candle closing well into the first candle's body. Sellers lose control, then buyers take over.`,
      `**Evening star** is the opposite at the top of an uptrend.`],
  dg:['candles',[[82,84,56,58],[55,57,48,52,`Star`],[54,80,53,78]]],
  use:[`Enter after the third candle closes, stop below the star's low.`],
  mis:[`Entering on the second candle before confirmation.`],
  key:[`Three candles: strong, small, strong opposite.`,`Morning = bullish. Evening = bearish.`],
  rel:['doji','engulfing','candlestick'],
  q:[[`A morning star appears at…`,[`Tops`,`Bottoms`],1,`It's a bullish reversal after a fall.`]] },

'market-structure': { t:`Market Structure`, lv:'I', ff:`HH, HL, LH, LL`, al:[`market structure`,`HH`,`HL`,`LH`,`LL`,`higher high`,`higher low`,`lower high`,`lower low`,`swing high`,`swing low`],
  s:`The pattern of swing highs and lows that tells you the true trend.`,
  ex:[`In an uptrend, price makes **Higher Highs (HH)** and **Higher Lows (HL)**. In a downtrend, **Lower Highs (LH)** and **Lower Lows (LL)**. Mark the swing points and the trend becomes obvious — no indicator needed.`,
      `As long as the structure holds, the trend is intact. When an uptrend fails to make a new high and breaks its last higher low, structure has shifted.`],
  dg:'struct',
  use:[`In an uptrend, look to buy at the next higher low.`,`Place stops below the last higher low.`],
  mis:[`Marking every tiny wiggle as a swing — use clear, obvious swings.`],
  key:[`Up = HH + HL. Down = LH + LL.`,`Last HL is the key level in an uptrend.`],
  rel:['bos-choch','trend','pullback','timeframes'],
  q:[[`In a downtrend price makes…`,[`HH and HL`,`LH and LL`],1,`Lower highs and lower lows.`]] },

'bos-choch': { t:`Break of Structure & CHoCH`, lv:'P', ff:`BOS & Change of Character`, al:[`BOS`,`break of structure`,`CHoCH`,`change of character`,`MSS`,`market structure shift`],
  s:`BOS = price breaks a swing in the trend's direction (trend continues). CHoCH = price breaks the opposite way (trend may be changing).`,
  ex:[`In an uptrend, when price breaks above the last higher high, that's a **BOS** — the trend continues. If price instead breaks below the last higher low, that's a **CHoCH** (also called market structure shift) — the first sign the uptrend may be ending.`,
      `These terms come from Smart Money Concepts (SMC) trading. Confirm with candle closes, not just wicks.`],
  dg:'bos',
  use:[`After a bearish CHoCH, look for a pullback to sell (lower high).`,`Use BOS to stay in trends longer.`],
  mis:[`Calling a wick through a level a BOS — wait for a close.`],
  key:[`BOS = continuation.`,`CHoCH = possible reversal.`,`Use candle closes.`],
  rel:['market-structure','liquidity-sweep','supply-demand'],
  q:[[`In an uptrend, breaking below the last higher low is a…`,[`BOS`,`CHoCH`],1,`It changes the character of the trend.`]] },

'breakout': { t:`Breakout & Fakeout`, lv:'B', al:[`breakout`,`breakouts`,`fakeout`,`false breakout`,`breakdown`],
  s:`A breakout is when price moves strongly past support or resistance. A fakeout is a breakout that quickly fails.`,
  ex:[`When price finally breaks a level many traders are watching, it can move fast as new buyers join and short-sellers exit.`,
      `But many breakouts fail. Signs of a real breakout: a strong candle **close** beyond the level, rising volume, and the higher-timeframe trend agreeing. A fakeout often traps traders who bought too early — and its failure can itself be a trade the other way.`],
  dg:'breakout',
  tb:{h:[`Real breakout`,`Fakeout`],r:[[`Strong close beyond level`,`Only a wick beyond level`],[`Volume rises`,`Volume weak`],[`Holds on retest`,`Quickly returns inside the range`]]},
  use:[`Either buy the strong close, or wait for a retest of the level.`],
  mis:[`Buying the first tick above resistance with no volume.`],
  key:[`Close + volume = confirmation.`,`Retest is a safer entry.`,`Failed breakout = signal the other way.`],
  rel:['pullback','sr','volume','liquidity-sweep'],
  q:[[`Which confirms a breakout better?`,[`A wick above resistance`,`A strong close above with high volume`],1,`Close plus volume shows real commitment.`]] },

'pullback': { t:`Pullback & Retest`, lv:'B', al:[`pullback`,`pullbacks`,`retest`,`retracement entry`,`buy the dip`],
  s:`A short move against the trend before it continues. A retest is when price comes back to a broken level to check it.`,
  ex:[`Trends don't move in straight lines. After a rise, price often pulls back to support, a moving average or a Fibonacci level, then continues up.`,
      `After a breakout, price often returns to the broken level (the retest). If old resistance now holds as support, it's a high-probability entry with a clear stop.`],
  use:[`Buy pullbacks in uptrends, not breakdowns.`,`Enter on a bullish candle at the retest level, stop just below it.`],
  mis:[`Confusing a trend reversal with a pullback — if structure breaks, it's no longer a pullback.`],
  key:[`Pullback = pause in trend.`,`Retest = old level being checked.`,`Better price, tighter stop.`],
  rel:['breakout','fibonacci','market-structure'],
  q:[[`After a breakout above ₹500, price returns to ₹500 and bounces. This is a…`,[`Retest`,`Fakeout`],0,`Old resistance is being tested as support.`]] },

'supply-demand': { t:`Supply & Demand Zones`, lv:'I', al:[`supply zone`,`demand zone`,`supply and demand`,`order block`,`order blocks`],
  s:`Price areas where big buyers (demand) or big sellers (supply) placed many orders before, causing strong moves.`,
  ex:[`A **demand zone** is the base where price started a strong rise — big buyers were active. A **supply zone** is the base before a sharp fall. When price returns there, leftover orders may push it away again.`,
      `Fresh zones (not yet revisited) are strongest. Each visit uses up orders, so zones weaken over time. In SMC language, a similar idea is called an **order block**.`],
  dg:'sd',
  use:[`Buy at fresh demand zones in an uptrend; stop just below the zone.`],
  mis:[`Marking huge zones — keep them tight around the base candles.`],
  key:[`Demand = buyers' base. Supply = sellers' base.`,`Fresh zones work best.`,`Zones weaken with each test.`],
  rel:['sr','volume-profile','bos-choch'],
  q:[[`Which zone is usually strongest?`,[`One tested five times`,`A fresh, untested zone`],1,`Fresh zones still hold unfilled orders.`]] },

'liquidity-sweep': { t:`Liquidity Sweep / Stop Hunt`, lv:'P', al:[`liquidity sweep`,`stop hunt`,`liquidity grab`,`equal lows`,`equal highs`],
  s:`A quick move past an obvious high or low to trigger stop-losses, before price reverses.`,
  ex:[`Many traders put stops just below equal lows or just above equal highs. That creates a pool of orders ("liquidity"). Large players may push price through that level to fill their big orders, then price snaps back.`,
      `The sign is a sharp wick through the level that closes back inside. For smart traders, the sweep itself can be the entry.`],
  dg:'sweep',
  use:[`Wait for the sweep and a close back inside before entering.`,`Avoid placing your stop exactly at the obvious level.`],
  mis:[`Placing stops at the exact same spot as everyone else.`],
  key:[`Obvious highs/lows = stop clusters.`,`Sweep + quick reversal = signal.`],
  rel:['sl-order','bos-choch','breakout'],
  q:[[`A liquidity sweep usually shows as…`,[`A long wick through a level, then a close back inside`,`A slow steady trend`],0,`Price grabs the stops then reverses.`]] }
});

// ===== Derivatives (F&O) =====
Object.assign(C, {
'derivatives': { t:`What are Derivatives`, lv:'B', al:[`derivatives`,`derivative`,`F&O`,`futures and options`,`underlying`],
  s:`Contracts whose price comes from (is "derived" from) another asset, like a share, index or commodity.`,
  ex:[`A derivative has no value of its own — it follows the **underlying** asset. If Nifty moves, Nifty futures and options move too.`,
      `The two main types are **futures** and **options**, together called F&O. They are used to hedge (protect a portfolio), to speculate with leverage, and for arbitrage. Because of leverage, losses can be much bigger than with normal shares — SEBI studies have found that most individual F&O traders lose money.`],
  dg:['flow',[`Underlying|Nifty, gold`,`Derivative|futures / options`,`Price follows|the underlying`]],
  tb:{h:[``,`Futures`,`Options`],r:[[`Buyer must…`,`Buy/sell at expiry (obligation)`,`Has a right, not obligation`],[`Upfront cost`,`Margin`,`Premium (for buyers)`],[`Risk for buyer`,`Large`,`Limited to premium`]]},
  use:[`Hedging: buy Nifty puts to protect a share portfolio.`,`Learn options in paper trading before risking real money.`],
  mis:[`Jumping into F&O with small capital because of leverage.`],
  key:[`Derivative = price comes from an underlying.`,`Futures = obligation. Options = right.`,`Leverage cuts both ways.`],
  rel:['futures','options','lot-margin','risk-management'],
  q:[[`An option buyer has…`,[`An obligation`,`A right, not an obligation`],1,`Options give the buyer a choice.`],[`What do Nifty options derive their price from?`,[`Gold`,`The Nifty index`],1,`Nifty is the underlying.`]] },

'futures': { t:`Futures`, lv:'I', al:[`futures`,`futures contract`,`expiry`,`rollover`,`premium to spot`],
  s:`A contract to buy or sell an asset at a fixed price on a future date (expiry).`,
  ex:[`When you buy a futures contract, you agree to buy the underlying at today's futures price on expiry. If price rises, you profit; if it falls, you lose — every rupee, multiplied by the lot size.`,
      `You only pay a margin (a part of the contract value), so it's leveraged. Profits and losses are settled every day (mark-to-market). Indian stock and index futures usually expire monthly (last expiry day of the month — check the current exchange calendar, as SEBI/NSE change expiry days from time to time).`,
      `The futures price is usually a little above the current (spot) price, mainly due to interest cost — this gap is called the **basis**. Moving a position to the next month before expiry is called **rollover**.`],
  f:`Futures P&L = (Sell Price − Buy Price) × Lot Size`,
  eg:[`You buy 1 lot of a stock future at ₹1,000 with a lot size of 500. Price rises to ₹1,020 → profit = ₹20 × 500 = ₹10,000. A ₹20 fall = ₹10,000 loss.`],
  use:[`Hedge a stock you hold by selling its future.`,`Trade index direction with strict stop-losses.`],
  mis:[`Forgetting that a small % move means a large rupee loss because of leverage.`],
  key:[`Obligation to buy/sell at expiry.`,`Leveraged — margin only.`,`Daily mark-to-market settlement.`],
  rel:['lot-margin','derivatives','options'],
  q:[[`Lot size 100. Bought at ₹500, sold at ₹490. P&L?`,[`−₹1,000`,`−₹100`,`+₹1,000`],0,`(490 − 500) × 100 = −₹1,000.`]] },

'lot-margin': { t:`Lot Size & Margin`, lv:'I', al:[`lot size`,`F&O margin`,`MTM`,`mark-to-market`,`SPAN`],
  s:`Lot size = fixed quantity in one F&O contract. Margin = money blocked by the broker to hold the position.`,
  ex:[`You can't buy 1 unit of Nifty futures — you must trade in lots set by the exchange. Lot sizes are revised from time to time, so always check the latest on the NSE website.`,
      `Margin for futures and option selling is a part of the full contract value (calculated by the exchange using SPAN + exposure margins). This is **leverage**: small money controls a big position. If losses eat into your margin, the broker can square off your position. Option buyers pay the full premium instead of margin.`],
  f:`Contract Value = Price × Lot Size\nLeverage ≈ Contract Value ÷ Margin`,
  eg:[`Contract value ₹10,00,000, margin ₹1,50,000 → leverage ≈ 6.7×. A 3% move in the underlying ≈ 20% gain or loss on your margin.`],
  use:[`Size your trades on the full contract value, not on the margin.`],
  mis:[`Using all your capital as margin with no buffer for daily MTM losses.`],
  key:[`Trade in lots, not single units.`,`Margin = leverage.`,`Check current lot sizes on NSE.`],
  rel:['futures','position-sizing','risk-management'],
  q:[[`Contract value ₹5,00,000, margin ₹1,00,000. Leverage?`,[`2×`,`5×`,`10×`],1,`5,00,000 ÷ 1,00,000 = 5×.`]] },

'options': { t:`Options Basics`, lv:'B', al:[`options`,`option`,`option chain`,`option contract`],
  s:`A contract that gives the buyer the right — not the obligation — to buy or sell at a fixed price before or on expiry.`,
  ex:[`There are two types: **Call** (right to buy) and **Put** (right to sell). The fixed price is the **strike price**. The buyer pays a **premium** to the seller (also called the writer).`,
      `The buyer's maximum loss is the premium paid. The seller collects the premium but takes on potentially large risk. Index options in India are European style — they are settled only at expiry, in cash. The **option chain** shows all strikes, premiums and open interest for an expiry.`],
  tb:{h:[``,`Buyer`,`Seller (writer)`],r:[[`Pays / receives`,`Pays premium`,`Receives premium`],[`Max loss`,`Premium`,`Can be very large`],[`Max profit`,`Large`,`Premium`],[`Time decay`,`Hurts`,`Helps`]]},
  use:[`Buy calls when strongly bullish, puts when strongly bearish — with a clear time window.`,`Use the option chain to find support and resistance from OI.`],
  mis:[`Buying cheap far out-of-the-money options as "lottery tickets" — most expire worthless.`],
  key:[`Call = right to buy. Put = right to sell.`,`Buyer risk = premium.`,`Time works against buyers.`],
  rel:['call','put','moneyness','premium'],
  q:[[`A put option gives the buyer the right to…`,[`Buy`,`Sell`],1,`Put = right to sell.`],[`Max loss for an option buyer is…`,[`Unlimited`,`The premium paid`],1,`The buyer can only lose the premium.`]] },

'call': { t:`Call Option`, lv:'B', ff:`CE (Call European)`, al:[`call option`,`call options`,`CE`,`long call`],
  s:`The right to buy the underlying at the strike price — buyers profit when price goes up.`,
  ex:[`You buy a call when you expect a rise. If price at expiry is above strike + premium, you profit. If it stays below the strike, the call expires worthless and you lose the premium.`,
      `On Indian option chains, calls are labelled **CE**. Breakeven for a call buyer = strike + premium paid.`],
  dg:'callpay',
  f:`Call value at expiry = max(0, Price − Strike)\nBuyer P&L = (max(0, Price − Strike) − Premium) × Lot Size\nBreakeven = Strike + Premium`,
  eg:[`Nifty 24,000 CE bought at ₹100. At expiry Nifty is 24,300 → value ₹300, profit ₹200 per unit. If Nifty is 23,900 → value 0, loss ₹100 per unit.`],
  use:[`Buy calls on strong bullish setups with momentum — time is your enemy.`],
  mis:[`Holding a losing call until expiry hoping it comes back.`],
  key:[`Bullish instrument.`,`Breakeven = strike + premium.`,`Max loss = premium.`],
  rel:['put','moneyness','premium','greeks'],
  q:[[`Strike 500, premium 20. Breakeven for call buyer?`,[`480`,`500`,`520`],2,`500 + 20 = 520.`]] },

'put': { t:`Put Option`, lv:'B', ff:`PE (Put European)`, al:[`put option`,`put options`,`PE option`,`long put`,`protective put`],
  s:`The right to sell the underlying at the strike price — buyers profit when price goes down.`,
  ex:[`You buy a put when you expect a fall, or to protect shares you own (a **protective put**, like insurance). If price at expiry is below strike − premium, you profit.`,
      `On Indian option chains, puts are labelled **PE**. Breakeven for a put buyer = strike − premium paid.`],
  dg:'putpay',
  f:`Put value at expiry = max(0, Strike − Price)\nBreakeven = Strike − Premium`,
  eg:[`Bank Nifty 52,000 PE bought at ₹250. At expiry Bank Nifty is 51,500 → value ₹500, profit ₹250 per unit.`],
  use:[`Hedge a portfolio before risky events by buying index puts.`],
  mis:[`Buying puts against a strong uptrend just because "it has gone up too much".`],
  key:[`Bearish or protective instrument.`,`Breakeven = strike − premium.`,`Max loss = premium.`],
  rel:['call','moneyness','premium','derivatives'],
  q:[[`Strike 1,000, premium 30. Put buyer breakeven?`,[`970`,`1,000`,`1,030`],0,`1,000 − 30 = 970.`]] },

'moneyness': { t:`Strike Price: ITM, ATM, OTM`, lv:'I', ff:`In / At / Out of the Money`, al:[`strike price`,`strike`,`ITM`,`ATM`,`OTM`,`in the money`,`at the money`,`out of the money`,`moneyness`],
  s:`Describes where the strike price is compared with the current market price.`,
  ex:[`**ATM (At the money):** strike ≈ current price. **ITM (In the money):** the option already has real value. **OTM (Out of the money):** no real value yet — only time value.`,
      `For a call, lower strikes are ITM. For a put, higher strikes are ITM. OTM options are cheaper but need a bigger move to profit; ITM options cost more but move more like the underlying.`],
  tb:{h:[`Nifty at 24,000`,`Call (CE)`,`Put (PE)`],r:[[`Strike 23,800`,`ITM`,`OTM`],[`Strike 24,000`,`ATM`,`ATM`],[`Strike 24,200`,`OTM`,`ITM`]]},
  use:[`Beginners often prefer ATM or slightly ITM options for cleaner moves.`],
  mis:[`Buying far OTM options because they are cheap — most expire at zero.`],
  key:[`ATM = near current price.`,`ITM = has intrinsic value.`,`OTM = only time value.`],
  rel:['premium','call','put','greeks'],
  q:[[`Price 500. A 450 call is…`,[`ITM`,`ATM`,`OTM`],0,`Right to buy at 450 when price is 500 → already has ₹50 value.`],[`Price 500. A 450 put is…`,[`ITM`,`OTM`],1,`Right to sell at 450 when price is 500 has no real value yet.`]] },

'premium': { t:`Option Premium`, lv:'I', ff:`Intrinsic Value + Time Value`, al:[`option premium`,`intrinsic value of option`,`time value`,`extrinsic value`],
  s:`The price of an option = intrinsic value (real value now) + time value (value of possible future moves).`,
  ex:[`**Intrinsic value** is how much the option is in the money right now. **Time value** (extrinsic value) is extra money paid for the chance of a bigger move before expiry.`,
      `Time value shrinks every day and becomes zero at expiry — this is **time decay**. It also rises when volatility (IV) rises. OTM and ATM options are made of only time value.`],
  f:`Premium = Intrinsic Value + Time Value\nCall intrinsic = max(0, Price − Strike)\nPut intrinsic = max(0, Strike − Price)`,
  eg:[`Share at ₹520. 500 CE trades at ₹35. Intrinsic = ₹20, time value = ₹15. At expiry, if price is still ₹520, the option will be worth only ₹20.`],
  use:[`Option buyers want fast moves; sellers want time to pass.`],
  mis:[`Not realising part of the premium is guaranteed to melt away by expiry.`],
  key:[`Premium = intrinsic + time value.`,`Time value → 0 at expiry.`,`Higher IV → higher premium.`],
  rel:['greeks','iv','moneyness'],
  q:[[`Price 210, strike 200 call, premium 18. Time value?`,[`₹8`,`₹10`,`₹18`],0,`Intrinsic 10, so time value = 18 − 10 = ₹8.`]] },

'greeks': { t:`Option Greeks`, lv:'P', ff:`Delta, Gamma, Theta, Vega`, al:[`option Greeks`,`Greeks`,`delta`,`gamma`,`theta`,`vega`,`time decay`],
  s:`Numbers that show how an option's price changes with price, time and volatility.`,
  ex:[`**Delta:** how much the option moves for a ₹1 move in the underlying (calls 0 to 1, puts 0 to −1; ATM ≈ 0.5). **Gamma:** how fast delta changes — highest for ATM options near expiry.`,
      `**Theta:** how much value the option loses per day from time decay (negative for buyers). **Vega:** how much the option changes for a 1% change in implied volatility.`],
  tb:{h:[`Greek`,`Measures`,`Buyer wants`],r:[[`Delta (Δ)`,`Sensitivity to price`,`Move in their direction`],[`Gamma (Γ)`,`Speed of delta change`,`High gamma near expiry = big swings`],[`Theta (Θ)`,`Daily time decay`,`Time on their side (it isn't)`],[`Vega (ν)`,`Sensitivity to IV`,`IV rising`]]},
  eg:[`A call with delta 0.6 and theta −4: if the stock rises ₹10, the call rises about ₹6; if nothing happens for a day, it loses about ₹4.`],
  use:[`Use delta to estimate how many options equal a share position.`,`Avoid buying options with very high theta unless you expect a quick move.`],
  mis:[`Ignoring theta and vega — a correct direction can still lose money.`],
  key:[`Delta = price. Theta = time. Vega = volatility. Gamma = change in delta.`,`Buyers fight theta; sellers earn it.`],
  rel:['premium','iv','moneyness'],
  q:[[`Which Greek measures time decay?`,[`Delta`,`Theta`,`Vega`],1,`Theta = daily loss from time passing.`],[`An ATM call's delta is about…`,[`0.1`,`0.5`,`1.0`],1,`ATM options have delta near 0.5.`]] },

'iv': { t:`Implied Volatility (IV)`, lv:'P', ff:`IV & India VIX`, al:[`implied volatility`,`IV`,`India VIX`,`VIX`,`IV crush`],
  s:`The market's expectation of how much price will move in future — built into option prices.`,
  ex:[`High IV = market expects big moves, so options are expensive. Low IV = calm expectations, options cheaper.`,
      `IV usually rises before big events (results, budget, elections) and falls sharply after — called **IV crush**. India VIX measures expected Nifty volatility; it's often called the "fear index".`],
  tb:{h:[`IV`,`Options are`,`Often suits`],r:[[`High`,`Expensive`,`Option sellers (with care)`],[`Low`,`Cheap`,`Option buyers`]]},
  eg:[`Before results a stock's ATM call costs ₹40 with IV 45%. Results come out flat, IV drops to 25%, and the call falls to ₹25 even though the stock barely moved.`],
  use:[`Avoid buying options right before events when IV is very high.`,`Watch India VIX for overall market fear.`],
  mis:[`Buying options before results and losing to IV crush despite getting the direction right.`],
  key:[`IV = expected future movement.`,`High IV = expensive options.`,`IV crush after events.`],
  rel:['greeks','premium','oi-pcr'],
  q:[[`After a big event, IV usually…`,[`Rises`,`Falls (IV crush)`],1,`Uncertainty is gone, so IV drops.`]] },

'oi-pcr': { t:`Open Interest & PCR`, lv:'I', ff:`OI & Put-Call Ratio`, al:[`open interest`,`OI`,`PCR`,`put-call ratio`,`put call ratio`],
  s:`Open interest = number of F&O contracts still open. PCR = put OI ÷ call OI, a mood indicator.`,
  ex:[`OI rises when new positions are created and falls when they are closed. Volume counts trades; OI counts open positions.`,
      `On the option chain, the strike with the highest call OI often acts as resistance (sellers defend it), and highest put OI as support. **PCR** above 1 means more puts than calls; extreme PCR readings are often read as contrarian signals.`],
  tb:{h:[`Price`,`OI`,`Usual reading`],r:[[`Up`,`Up`,`Long build-up (bullish)`],[`Down`,`Up`,`Short build-up (bearish)`],[`Up`,`Down`,`Short covering`],[`Down`,`Down`,`Long unwinding`]]},
  f:`PCR = Total Put OI ÷ Total Call OI`,
  use:[`Use highest call/put OI strikes as intraday resistance/support zones.`],
  mis:[`Treating OI levels as fixed walls — big OI can shift during the day.`],
  key:[`OI = open contracts.`,`Price + OI together show build-up type.`,`Max call OI ≈ resistance, max put OI ≈ support.`],
  rel:['options','sr','iv'],
  q:[[`Price falls and OI rises. This is…`,[`Long build-up`,`Short build-up`],1,`New short positions are being added.`]] },

'buy-vs-sell': { t:`Option Buying vs Selling`, lv:'P', al:[`option buying`,`option selling`,`option writing`,`naked selling`,`hedged selling`,`spread strategy`],
  s:`Buyers pay a small premium for a big potential move. Sellers collect premium and win more often, but face larger risk.`,
  ex:[`**Option buyers** need the move to be fast and big — time decay works against them. They win less often, but wins can be large and losses are limited to the premium.`,
      `**Option sellers** earn as long as price doesn't move too much against them. They win more often, but one big move can wipe out many months of gains. Selling needs much more margin. Many sellers use **spreads** (selling one option and buying another) to cap risk.`],
  tb:{h:[``,`Buyer`,`Seller`],r:[[`Win rate`,`Lower`,`Higher`],[`Max profit`,`Large`,`Limited to premium`],[`Max loss`,`Premium`,`Can be very large (unless hedged)`],[`Capital needed`,`Low`,`High`],[`Time decay`,`Enemy`,`Friend`]]},
  use:[`If selling, prefer hedged spreads over naked positions.`,`If buying, trade only clear, fast-moving setups.`],
  mis:[`Selling naked options with no stop because "it usually works".`],
  key:[`Buyers: limited risk, need speed.`,`Sellers: high win rate, tail risk.`,`Hedge when selling.`],
  rel:['greeks','iv','risk-management'],
  q:[[`Who benefits from time decay?`,[`Option buyer`,`Option seller`],1,`Sellers keep the premium as time value melts.`]] }
});

// ===== Risk Management, Trading Psychology, Mutual Funds & ETFs =====
Object.assign(C, {
// ---------- Risk Management ----------
'risk-management': { t:`What is Risk Management`, lv:'B', al:[`risk management`,`capital protection`],
  s:`The rules that protect your money so that no single trade — or bad week — can destroy your account.`,
  ex:[`Every trader is wrong often. Risk management decides how much you lose when you are wrong. Good traders focus on losses first; profits take care of themselves.`,
      `The core tools: a stop-loss on every trade, small position sizes (often 1–2% risk per trade), good risk-to-reward, daily and weekly loss limits, and not putting everything in one idea.`],
  tb:{h:[`Loss`,`Gain needed to recover`],r:[[`10%`,`11%`],[`25%`,`33%`],[`50%`,`100%`],[`75%`,`300%`],[`90%`,`900%`]],c:`Big losses are very hard to recover — that's why protecting capital comes first.`},
  use:[`Set a max risk per trade (1%) and a max daily loss (3%) — stop trading for the day when hit.`,`Write your risk rules into your trading plan.`],
  mis:[`Risking 10–20% on one "sure" trade.`,`Removing the stop-loss when price comes near it.`],
  key:[`Protect capital first.`,`Small losses are survivable; big ones are not.`,`Rules must be fixed before the trade.`],
  rel:['position-sizing','risk-reward','drawdown','trading-plan'],
  q:[[`After a 50% loss, what gain gets you back to start?`,[`50%`,`75%`,`100%`],2,`₹100 → ₹50 needs +100% to return to ₹100.`]] },

'position-sizing': { t:`Position Sizing (1% Rule)`, lv:'I', al:[`position sizing`,`position size`,`1% rule`,`2% rule`,`risk per trade`],
  s:`Deciding how many shares or lots to trade so that hitting your stop-loss costs only a small, fixed % of your capital.`,
  ex:[`Position size is not chosen by "feel". First decide how much money you are willing to lose on this trade (e.g. 1% of capital). Then divide by how far your stop is from entry.`,
      `This way, a wide stop means a smaller position and a tight stop means a bigger one — but the rupee risk stays the same on every trade.`],
  f:`Risk Amount = Capital × Risk %\nPosition Size = Risk Amount ÷ (Entry − Stop-loss)`,
  eg:[`Capital ₹2,00,000, risk 1% = ₹2,000. Entry ₹500, stop ₹490 → risk per share ₹10. Position = 2,000 ÷ 10 = 200 shares.`],
  tb:{h:[`Capital`,`Risk 1%`,`Stop distance`,`Shares`],r:[[`₹1,00,000`,`₹1,000`,`₹5`,`200`],[`₹1,00,000`,`₹1,000`,`₹20`,`50`],[`₹5,00,000`,`₹5,000`,`₹10`,`500`]]},
  use:[`Calculate size before every trade — keep a calculator or sheet ready.`],
  mis:[`Using the same quantity on every trade regardless of stop distance.`],
  key:[`Risk a fixed % per trade.`,`Size = risk ÷ stop distance.`,`Wide stop → small size.`],
  rel:['risk-management','sl-order','atr','risk-reward'],
  q:[[`Capital ₹1,00,000, risk 1%, stop distance ₹4. Shares?`,[`100`,`250`,`400`],1,`₹1,000 ÷ ₹4 = 250 shares.`]] },

'risk-reward': { t:`Risk : Reward Ratio`, lv:'B', ff:`R:R`, al:[`risk reward`,`risk:reward`,`risk-reward`,`risk to reward`,`R:R`,`RR`,`R-multiple`],
  s:`Compares how much you could lose (to your stop) with how much you could gain (to your target).`,
  ex:[`If you risk ₹10 to make ₹20, your risk:reward is 1:2. With 1:2, you can be right only 40% of the time and still make money.`,
      `Traders often measure results in "R": 1R = the amount risked. A trade that makes twice the risk is +2R.`],
  dg:'rr',
  f:`Risk = Entry − Stop-loss\nReward = Target − Entry\nR:R = Risk : Reward`,
  tb:{h:[`R:R`,`Win rate needed to break even`],r:[[`1 : 1`,`50%`],[`1 : 2`,`33%`],[`1 : 3`,`25%`]]},
  eg:[`Buy at ₹200, stop ₹195, target ₹215 → risk ₹5, reward ₹15 → 1:3.`],
  use:[`Take trades with at least 1:2 unless your win rate is very high.`],
  mis:[`Setting unrealistic targets just to make R:R look good on paper.`],
  key:[`1:2 or better is a common minimum.`,`Higher R:R → lower win rate needed.`],
  rel:['position-sizing','expectancy','sl-order'],
  q:[[`Entry 100, stop 96, target 112. R:R?`,[`1:2`,`1:3`,`1:4`],1,`Risk 4, reward 12 → 1:3.`]] },

'expectancy': { t:`Win Rate & Expectancy`, lv:'I', al:[`win rate`,`expectancy`,`edge`,`profit factor`,`backtest`,`backtesting`],
  s:`Expectancy tells you how much you make on average per trade, combining win rate and average win/loss size.`,
  ex:[`A high win rate alone doesn't make money — if your losses are much bigger than your wins, you still lose. Expectancy combines both.`,
      `Positive expectancy over many trades = an **edge**. You find it by backtesting your rules on past data and by journaling live trades.`],
  f:`Expectancy = (Win% × Avg Win) − (Loss% × Avg Loss)`,
  eg:[`Win rate 40%, average win ₹3,000, average loss ₹1,000 → (0.4 × 3,000) − (0.6 × 1,000) = ₹600 per trade on average.`],
  use:[`Track every trade to measure your real win rate and averages.`,`Judge a strategy over 50–100+ trades, not 5.`],
  mis:[`Changing strategy after 3 losses — short streaks are normal.`],
  key:[`Win rate + R:R together decide profit.`,`Positive expectancy = edge.`,`Needs a big sample.`],
  rel:['risk-reward','journal','drawdown'],
  q:[[`Win 50%, avg win ₹2,000, avg loss ₹1,000. Expectancy?`,[`₹500`,`₹1,000`,`₹1,500`],0,`(0.5 × 2,000) − (0.5 × 1,000) = ₹500.`]] },

'drawdown': { t:`Drawdown`, lv:'I', al:[`drawdown`,`max drawdown`,`MDD`,`losing streak`],
  s:`The fall in your account from its highest point to its lowest point before a new high.`,
  ex:[`Every strategy has drawdowns. **Max drawdown** is the biggest peak-to-trough fall — it shows the pain you must be ready to sit through.`,
      `Losing streaks are normal: with a 50% win rate, 6 losses in a row will happen fairly often over a few hundred trades. Small risk per trade keeps drawdowns survivable.`],
  dg:'dd',
  f:`Drawdown % = (Peak − Lowest Value) ÷ Peak × 100`,
  eg:[`Account rises to ₹3,00,000, then falls to ₹2,40,000 → drawdown = 20%.`],
  use:[`Cut position size by half during a deep drawdown.`,`Know your strategy's historical max drawdown.`],
  mis:[`Increasing size to "win it back" during a drawdown.`],
  key:[`Peak to trough fall.`,`Normal part of trading.`,`Smaller risk = smaller drawdowns.`],
  rel:['risk-management','expectancy','revenge'],
  q:[[`Peak ₹1,00,000, low ₹85,000. Drawdown?`,[`8.5%`,`15%`,`85%`],1,`15,000 ÷ 1,00,000 = 15%.`]] },

'diversification': { t:`Diversification`, lv:'B', al:[`diversification`,`diversify`,`asset allocation`,`portfolio`],
  s:`Spreading money across different shares, sectors and assets so one bad event can't hurt you too much.`,
  ex:[`"Don't put all your eggs in one basket." If you own only one share and it crashes, you lose big. If you own 15 shares across sectors, one crash hurts much less.`,
      `**Asset allocation** goes further: mixing equity, debt, gold and cash. But too many holdings (over-diversification) can make your returns just average.`],
  tb:{h:[`Level`,`Example`],r:[[`Shares`,`10–20 companies`],[`Sectors`,`Banks, IT, FMCG, pharma…`],[`Assets`,`Equity, debt, gold`],[`Countries`,`India + US funds`]]},
  use:[`Limit any single share to about 5–10% of your portfolio.`,`Avoid holding many shares from the same sector.`],
  mis:[`Owning 10 different bank shares and calling it diversified.`],
  key:[`Spread risk across holdings and assets.`,`Too much diversification = average returns.`],
  rel:['risk-management','mutual-fund','etf'],
  q:[[`Which is better diversified?`,[`10 bank shares`,`10 shares across 8 sectors`],1,`Different sectors reduce concentrated risk.`]] },

// ---------- Trading Psychology ----------
'trading-psychology': { t:`Trading Psychology`, lv:'B', al:[`trading psychology`,`emotions`,`fear and greed`,`greed`,`fear`],
  s:`How your emotions — mainly fear and greed — affect your trading decisions.`,
  ex:[`Most traders don't fail because of bad strategies; they fail because they don't follow them. Fear makes you exit good trades early or skip entries. Greed makes you over-size, hold losers, and chase moves.`,
      `Good psychology is built with systems: a written plan, fixed risk, a journal, and accepting that losses are part of the business.`],
  tb:{h:[`Emotion`,`Typical mistake`,`Fix`],r:[[`Fear`,`Exiting winners too early`,`Pre-set targets, trail stops`],[`Greed`,`Over-sizing, no stop`,`Fixed 1% risk rule`],[`Hope`,`Holding losers`,`Hard stop-loss`],[`Anger`,`Revenge trading`,`Daily loss limit`]]},
  use:[`Rate your emotions before each trade in your journal.`,`Take a break after 2–3 losses in a row.`],
  mis:[`Believing you can control emotions with willpower alone — rules work better.`],
  key:[`Fear and greed drive most mistakes.`,`Systems beat willpower.`,`Losses are a business cost.`],
  rel:['fomo','revenge','overtrading','journal'],
  q:[[`Which emotion often causes holding a losing trade too long?`,[`Hope`,`Boredom`],0,`Hoping it comes back stops you from cutting the loss.`]] },

'fomo': { t:`FOMO`, lv:'B', ff:`Fear Of Missing Out`, al:[`FOMO`,`fear of missing out`,`chasing`],
  s:`The urge to jump into a trade because price is moving fast and you're afraid of missing the profit.`,
  ex:[`FOMO makes you buy late — after the big move — usually far from support, with a bad stop and poor risk:reward. That's often exactly where early buyers take profit.`,
      `There will always be another trade. Missing one move costs nothing; chasing badly costs real money.`],
  use:[`If you missed the entry, wait for a pullback or retest.`,`Only trade setups written in your plan.`],
  mis:[`Buying a stock already up 15% today because "it will go more".`],
  key:[`FOMO = buying late.`,`Missed trades cost nothing.`,`Wait for your setup.`],
  rel:['trading-psychology','pullback','trading-plan'],
  q:[[`Best action after missing a breakout?`,[`Chase it immediately`,`Wait for a pullback or skip it`],1,`Chasing gives bad entries and poor R:R.`]] },

'revenge': { t:`Revenge Trading`, lv:'B', al:[`revenge trading`,`revenge trade`,`tilt`],
  s:`Taking quick, bigger, unplanned trades to "win back" a loss — usually making it worse.`,
  ex:[`After a loss, anger and ego say "the market owes me". You trade bigger, skip your rules, and often lose more. One bad day can become a disaster.`],
  use:[`Set a daily loss limit (e.g. 2–3% or 2 losing trades) and stop when hit.`,`Walk away from the screen after a big loss.`],
  mis:[`Doubling quantity on the next trade after a loss.`],
  key:[`Loss → anger → bigger risk → bigger loss.`,`Daily loss limit is the cure.`],
  rel:['trading-psychology','drawdown','overtrading'],
  q:[[`Best response after hitting your daily loss limit?`,[`One more trade to recover`,`Stop trading for the day`],1,`Protect capital and your mind.`]] },

'overtrading': { t:`Overtrading`, lv:'B', al:[`overtrading`,`over-trading`],
  s:`Trading too often or too big — usually out of boredom, excitement or the need for action.`,
  ex:[`More trades doesn't mean more profit. Every extra trade costs brokerage, taxes and slippage, and low-quality setups lower your win rate.`,
      `Professional traders often wait hours or days for the right setup.`],
  use:[`Set a maximum number of trades per day (e.g. 2–3).`,`Only take A+ setups from your plan.`],
  mis:[`Trading just because the market is open.`],
  key:[`Quality over quantity.`,`Charges add up fast.`,`Patience is a skill.`],
  rel:['revenge','trading-plan','journal'],
  q:[[`Overtrading often comes from…`,[`Following a clear plan`,`Boredom or excitement`],1,`Emotional need for action drives it.`]] },

'journal': { t:`Trading Journal & Discipline`, lv:'B', al:[`trading journal`,`journal`,`journaling`,`discipline`,`trade log`],
  s:`A record of every trade — why you took it, how it went, and how you felt — used to improve.`,
  ex:[`A journal turns random experience into data. Over time it shows which setups work, which times of day suit you, and which mistakes repeat.`,
      `Discipline means doing what your plan says even when you don't feel like it. The journal is how you check if you were disciplined.`],
  tb:{h:[`Column`,`Example`],r:[[`Date & time`,`18 Nov, 10:45 AM`],[`Setup`,`Pullback to 20 EMA`],[`Entry / Stop / Target`,`₹520 / ₹512 / ₹540`],[`Result (R)`,`+2.1R`],[`Emotion`,`Calm / FOMO / fear`],[`Lesson`,`Waited for close — good`]]},
  use:[`Review the journal every weekend.`,`Screenshot the chart at entry and exit.`],
  mis:[`Only recording winning trades.`],
  key:[`What gets measured gets improved.`,`Record setup, result and emotion.`,`Review weekly.`],
  rel:['trading-plan','expectancy','trading-psychology'],
  q:[[`Why journal losing trades too?`,[`To feel bad`,`To find repeated mistakes`],1,`Losses teach the most.`]] },

'trading-plan': { t:`Trading Plan & Rulebook`, lv:'I', al:[`trading plan`,`rulebook`,`trading rules`,`checklist`],
  s:`A written set of rules that decides what you trade, when you enter, where you exit and how much you risk.`,
  ex:[`A trading plan removes guesswork. If it's not in the plan, you don't trade it. It makes your results measurable and stops emotional decisions.`,
      `A good plan covers: markets and timeframes, setup rules, entry trigger, stop-loss placement, targets, risk per trade, daily loss limit, and a pre-trade checklist.`],
  dg:['flow',[`Setup present?`,`Trend & level agree?`,`Stop and size calculated?`,`R:R at least 1:2?`,`Take the trade`]],
  use:[`Print your checklist and tick it before every trade.`,`Update the plan monthly from journal lessons — not in the middle of a trade.`],
  mis:[`Changing rules during a live trade.`],
  key:[`No plan = gambling.`,`Checklist before every trade.`,`Improve the plan from your journal.`],
  rel:['journal','risk-management','position-sizing'],
  q:[[`When should you change your trading rules?`,[`During a losing trade`,`During a calm review using journal data`],1,`Never change rules mid-trade.`]] },

// ---------- Mutual Funds & ETFs ----------
'mutual-fund': { t:`What is a Mutual Fund`, lv:'B', al:[`mutual fund`,`mutual funds`,`MF`,`fund manager`,`units`],
  s:`A pool of money from many investors, managed by a professional fund manager, invested in shares, bonds or both.`,
  ex:[`Instead of picking shares yourself, you buy **units** of a fund. The fund manager invests the pooled money as per the fund's goal. Funds are run by asset management companies (AMCs) like SBI MF, HDFC MF or Nippon India, and regulated by SEBI.`,
      `Benefits: diversification, professional management, small starting amounts (often ₹100–₹500), and easy SIPs. You pay a small yearly fee called the expense ratio.`],
  dg:['flow',[`Investors|pool money`,`Manager|picks`,`Portfolio|shares, bonds`,`NAV|unit price`]],
  use:[`Good for long-term goals if you don't have time to research single shares.`,`Check the fund's 5–10 year record against its benchmark index.`],
  mis:[`Choosing a fund only because of last year's top return.`],
  key:[`Pool of money, professionally managed.`,`You own units, priced at NAV.`,`Regulated by SEBI.`],
  rel:['nav','sip','mf-types','expense-ratio'],
  q:[[`Who manages a mutual fund's investments?`,[`You`,`A fund manager`],1,`A professional manager runs the portfolio.`]] },

'nav': { t:`NAV`, lv:'B', ff:`Net Asset Value`, al:[`NAV`,`net asset value`],
  s:`The price of one unit of a mutual fund, calculated once at the end of each market day.`,
  ex:[`NAV = total value of everything the fund owns, minus its expenses, divided by the number of units. Unlike shares, mutual funds don't trade all day — your buy or sell happens at that day's closing NAV.`,
      `A high NAV doesn't mean expensive and a low NAV doesn't mean cheap. What matters is how much the NAV grows over time.`],
  f:`NAV = (Total Assets − Liabilities) ÷ Total Units`,
  eg:[`A fund's assets are worth ₹500 crore, liabilities ₹2 crore, units 10 crore → NAV ≈ ₹49.80.`],
  use:[`Compare funds by returns (CAGR/XIRR), not by NAV level.`],
  mis:[`Buying a "cheap" ₹10 NAV new fund thinking it will grow faster.`],
  key:[`NAV = value per unit.`,`Updated once a day.`,`Low NAV ≠ cheap.`],
  rel:['mutual-fund','etf','cagr-xirr'],
  q:[[`Is a ₹10 NAV fund cheaper than a ₹100 NAV fund?`,[`Yes`,`No — compare growth, not NAV`],1,`Both grow by % — the NAV level doesn't matter.`]] },

'sip': { t:`SIP`, lv:'B', ff:`Systematic Investment Plan`, al:[`SIP`,`systematic investment plan`,`rupee cost averaging`,`compounding`,`step-up SIP`],
  s:`Investing a fixed amount in a mutual fund every month (or week), automatically.`,
  ex:[`A SIP builds the habit of investing regularly. You buy more units when prices are low and fewer when high — this is called **rupee cost averaging**, and it removes the need to time the market.`,
      `Over long periods, **compounding** does the heavy work: your returns start earning their own returns. A **step-up SIP** increases the amount every year, e.g. by 10%.`],
  dg:['bars',[[`10 years`,11.6],[`20 years`,50.0],[`30 years`,176.5]],` lakh`],
  dgc:`₹5,000 a month — approximate value at 12% yearly return (example, not guaranteed). Total invested: ₹6L, ₹12L, ₹18L.`,
  f:`Future Value ≈ P × [((1 + r)ⁿ − 1) ÷ r] × (1 + r)\nP = monthly amount, r = monthly return, n = months`,
  use:[`Start early — time matters more than amount.`,`Don't stop SIPs when markets fall; that's when you buy cheaper.`],
  mis:[`Stopping the SIP during a crash.`,`Expecting big results in 1–2 years.`],
  key:[`Fixed amount, regular interval.`,`Rupee cost averaging.`,`Compounding needs time.`],
  rel:['mutual-fund','cagr-xirr','mf-types'],
  q:[[`In a SIP, when prices fall you buy…`,[`More units`,`Fewer units`],0,`Same money buys more units at a lower NAV.`]] },

'expense-ratio': { t:`Expense Ratio, Direct vs Regular`, lv:'I', al:[`expense ratio`,`TER`,`direct plan`,`regular plan`,`exit load`],
  s:`The yearly fee a mutual fund charges, as a % of your investment. Direct plans charge less than regular plans.`,
  ex:[`The expense ratio (TER) is taken out of the fund's NAV daily — you never see a bill, but it reduces returns. SEBI sets maximum limits.`,
      `**Regular plans** include a commission for the distributor. **Direct plans** have no commission, so their expense ratio is lower. Over 20 years, even a 0.7% yearly difference makes a big gap. **Exit load** is a fee if you sell within a set time (often 1% within 1 year).`],
  tb:{h:[``,`Direct plan`,`Regular plan`],r:[[`Bought via`,`AMC site / direct apps`,`Distributor / agent`],[`Commission`,`None`,`Included`],[`Expense ratio`,`Lower`,`Higher`],[`Returns`,`Slightly higher`,`Slightly lower`]]},
  eg:[`₹10 lakh at 12% for 20 years ≈ ₹96 lakh. At 11.3% (0.7% higher fee) ≈ ₹85 lakh. That fee cost about ₹11 lakh.`],
  use:[`Choose direct plans if you can pick funds yourself.`,`Prefer low-cost index funds for core holdings.`],
  mis:[`Ignoring a "small" 1% fee — it compounds against you.`],
  key:[`Fee is taken from NAV daily.`,`Direct < Regular in cost.`,`Small fees compound over time.`],
  rel:['mutual-fund','mf-types','etf'],
  q:[[`Which plan has no distributor commission?`,[`Direct`,`Regular`],0,`Direct plans skip the distributor.`]] },

'mf-types': { t:`Types of Mutual Funds`, lv:'B', ff:`Equity, Debt, Hybrid, Index`, al:[`equity fund`,`debt fund`,`hybrid fund`,`index fund`,`index funds`,`ELSS`,`flexi cap`,`large cap fund`,`small cap fund`],

  rel:['mutual-fund','etf','index','expense-ratio'],
  q:[[`An index fund…`,[`Tries to beat the market by stock picking`,`Copies an index`],1,`It simply tracks an index like Nifty 50.`]] },

'etf': { t:`ETF`, lv:'B', ff:`Exchange Traded Fund`, al:[`ETF`,`ETFs`,`exchange traded fund`,`Nifty BeES`,`gold ETF`],

'cagr-xirr': { t:`CAGR & XIRR`, lv:'I', ff:`Compound Annual Growth Rate & Extended Internal Rate of Return`, al:[`CAGR`,`XIRR`,`compound annual growth rate`,`annualised return`,`absolute return`],
  s:`CAGR = average yearly growth of a single investment. XIRR = yearly return when money goes in at different times (like a SIP).`,
  ex:[`**Absolute return** only shows total % gain, ignoring time. **CAGR** converts it into a smooth yearly rate, so you can compare investments of different lengths.`,
      `For SIPs, each instalment is invested on a different date, so CAGR doesn't fit. **XIRR** handles many dates and amounts. Excel and Google Sheets have an XIRR function.`],
  f:`CAGR = (Ending Value ÷ Starting Value)^(1 ÷ Years) − 1`,
  eg:[`₹1,00,000 grows to ₹2,00,000 in 6 years → CAGR = 2^(1/6) − 1 ≈ 12.2% per year. Absolute return = 100%.`],
  use:[`Use CAGR for lump-sum investments and company growth.`,`Use XIRR for SIPs and portfolios with many transactions.`],
  mis:[`Comparing a 3-year absolute return with a 1-year return.`],
  key:[`Absolute = total %. CAGR = yearly rate.`,`XIRR = for multiple dates (SIP).`],
  rel:['sip','growth','mutual-fund'],
  q:[[`Best measure for a SIP's return?`,[`Absolute return`,`CAGR`,`XIRR`],2,`XIRR handles many investment dates.`]] }

function P(a) {

  if (eg) o.eg = eg;
  if (key) o.key = key;
  if (q) o.q = q;
  C[id] = Object.assign(o, x || {});
  return id;
}
// Folder: items may be topic rows (arrays), existing topic ids (strings) or sub-folders (objects)
function F(id, t, d, items) { return { id, t, d, ch: items.map(x => Array.isArray(x) ? P(x) : x) }; }
function SEC(id, t, d, items) { FA_SEC.push(F(id, t, d, items)); }

  ['double-entry',`Double-entry Bookkeeping`,'B',0,[`double entry`,`double-entry`,`debit and credit`,`debit`,`credit entry`],`Every transaction is recorded twice — a debit in one account and an equal credit in another — so the books always balance.`,

  [`Separate organic from acquired.`,`Organic is more reliable.`],[[`Growth from buying another company is…`,[`Inorganic`,`Organic`],0,`It comes from acquisition.`]]],
 ['base-effect',`Base Effect`,'I',0,[`base effect`,`low base`,`high base`],`When growth looks very high or low only because last year's number was unusually low or high.`,

  [`Low base flatters growth.`,`Compare with pre-disruption years.`],[[`100% growth after a 60% fall means profit is…`,[`Still below the old level`,`Double the old level`],0,`₹40 → ₹80 is still below ₹100.`]]],
 ['real-vs-nominal-growth',`Real vs Nominal Growth`,'I',0,[`real growth`,`nominal growth`,`inflation-adjusted growth`],`Nominal growth includes inflation; real growth removes it.`,

 ['market-share',`Market Share`,'B',0,[`market share`],`A company's sales as a % of total industry sales.`,

  [`Rising share = winning.`,`Leaders often earn more.`],[[`Company ₹300 cr, industry ₹1,500 cr. Share?`,[`20%`,`5%`],0,`300 ÷ 1,500 = 20%.`]]],
 ['tam',`Total Addressable Market (TAM)`,'I',`TAM`,[`TAM`,`total addressable market`,`addressable market`,`market size`],`The total sales possible if a company captured the whole market for its product.`,

 ['growth-runway',`Growth Runway`,'I',0,[`growth runway`,`long runway`],`How many years a company can keep growing at a high rate.`,

 ['order-book',`Order Book`,'I',0,[`order book`,`order backlog`,`backlog`],`The value of orders received but not yet delivered — common in capital goods, defence, EPC and IT.`,

 ['order-inflow',`Order Inflow & Book-to-Bill`,'P',0,[`order inflow`,`book-to-bill`,`book to bill`],`New orders received in a period; book-to-bill compares new orders with revenue billed.`,

// ===== FA 12: Valuation Methods =====

 F('fa-valm-basic', `Approaches`, `The main ways to value a business.`, [

   [`Relative valuation is quick but can be misleading when the whole sector is overpriced. Absolute valuation is thorough but depends on assumptions. Professionals use both.`],0,`DCF says ₹800; peers at P/E 25 imply ₹900 → fair value range ₹800–900.`,

  ['terminal-value',`Terminal Value`,'P',`TV`,[`terminal value`,`perpetuity value`],`The value of all cash flows after the forecast period, combined into one number.`,

  ['terminal-growth-rate',`Terminal Growth Rate`,'P',0,[`terminal growth rate`,`perpetual growth rate`],`The growth rate assumed forever after the forecast period.`,

 F('fa-valm-rates', `Discount Rate (WACC, CAPM, Beta)`, `What return investors require.`, [
  ['discount-rate',`Discount Rate`,'I',0,[`discount rate`,`required return`,`hurdle rate`],`The return you require from an investment, used to bring future cash flows to today's value.`,
   [`Higher risk = higher discount rate = lower value. For companies, it's usually WACC (for the whole firm) or cost of equity (for shareholders).`],0,`Same cash flows discounted at 14% instead of 10% give a much lower value.`,

  ['wacc',`WACC`,'P',`Weighted Average Cost of Capital`,[`WACC`,`weighted average cost of capital`,`cost of capital`],`The blended cost of all the money a company uses — equity and debt — weighted by their share.`,
   [`WACC is the minimum return a company must earn to create value. In India, WACC for most companies is roughly 10–14%.`],`WACC = (E ÷ V) × Ke + (D ÷ V) × Kd × (1 − Tax)\nV = E + D`,`Equity 70% at 13%, debt 30% at 9% (6.75% after tax) → WACC ≈ 9.1% + 2.0% = 11.1%.`,

   [`Shareholders' required return.`,`Always above cost of debt.`],[[`Rf 7%, beta 1, ERP 6%. Ke?`,[`13%`,`7%`],0,`7 + 1 × 6 = 13%.`]]],
  ['capm',`CAPM`,'P',`Capital Asset Pricing Model`,[`CAPM`,`capital asset pricing model`],`A model to estimate expected return based on market risk (beta).`,
   [`It says expected return = risk-free rate + extra return for taking market risk. Simple and widely used, but beta from past prices isn't a perfect measure of business risk.`],`Expected Return = Rf + β × (Rm − Rf)`,`Rf 7%, market return 13%, beta 1.2 → 7 + 1.2 × 6 = 14.2%.`,

  ['beta',`Beta`,'I',`β`,[`beta`,`stock beta`],`How much a stock moves compared with the market.`,

   [`Base of all required returns.`,`Higher Rf = lower valuations.`],[[`What's usually used as India's risk-free rate?`,[`10-year G-sec yield`,`Savings account rate`],0,`Long-term government bond yield.`]]],
  ['equity-risk-premium',`Equity Risk Premium`,'P',`ERP`,[`equity risk premium`,`ERP`,`market risk premium`],`The extra return investors expect from stocks over risk-free bonds.`,

// ===== FA 13: Business Quality & Moats =====
SEC('fa-quality', `Business Quality & Moats`, `What makes a business great — and keeps it great.`, [
 F('fa-q-model', `Business Model`, `How a company makes money.`, [
  ['business-model',`Business Model`,'B',0,[`business model`],`The way a company creates value and makes money — who pays, for what, and how often.`,
   [`Understand it in simple words before looking at any number: what it sells, to whom, how it's priced, what it costs to deliver, and why customers choose it.`],0,`A paint company buys chemicals, makes paints, sells through 70,000 dealers, and earns repeat sales from repainting.`,
   [`Explain it in two lines.`,`Who pays, why, how often.`],[[`The first step in analysing a company is understanding its…`,[`Business model`,`Share price chart`],0,`Know how it makes money.`]]],

 F('gl-val', `Valuation & Return Extras`, `More measures of value and return.`, [

  ['dupont-5-step',`5-step DuPont`,'P',0,[`5-step DuPont`,`extended DuPont`,`tax burden`,`interest burden`],`An extended DuPont that splits ROE into tax burden, interest burden, operating margin, asset turnover and leverage.`,

 F('gl-policy', `Tax, Trade & Policy Terms`, `Government rules that affect companies.`, [

  ['qsr-metrics',`QSR & Restaurants`,'I',`Quick Service Restaurants`,[`QSR`,`quick service restaurants`,`ADS`,`average daily sales`],`Restaurant chains are judged by same-store sales growth (SSSG), average daily sales per store (ADS), store additions and delivery mix.`,

SEC('fa-advanced', `Advanced Ideas`, `Deeper concepts used by experienced investors.`, [
 ['seven-powers',`7 Powers`,'P',0,[`7 Powers`,`seven powers`,`counter-positioning`,`process power`,`cornered resource`],`Hamilton Helmer's framework of seven sources of lasting advantage: scale economies, network economies, counter-positioning, switching costs, branding, cornered resource and process power.`,
  [`Each "power" must give both a benefit (higher profits) and a barrier (rivals can't copy it). It's a sharper way to identify moats.`],0,`Counter-positioning: a low-cost index fund model that incumbents couldn't copy without hurting their own fee business.`,
  [`Benefit + barrier.`,`Seven types of moat.`],[[`Who wrote "7 Powers"?`,[`Hamilton Helmer`,`Peter Lynch`],0,`Published in 2016.`]]],
 ['scale-economies-shared',`Scale Economies Shared`,'P',0,[`scale economies shared`],`Passing the savings from growing scale back to customers as lower prices, which wins more customers and more scale.`,

 ['capital-cycle',`Capital Cycle`,'P',0,[`capital cycle`],`High returns attract new investment and capacity, which lowers returns; low returns cause capacity cuts, which later raise returns.`,
