<style>
:root{--bg:#000;--tx:#fff;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.36);--line:rgba(255,255,255,.085);--gold:#d6b25e;--gold2:#f0d58c;--gd:rgba(214,178,94,.12);--red:#ff5f57;--green:#3ecf8e;--top:calc(56px + env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.i{width:100%;height:100%;display:block}
b{font-weight:650}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);z-index:20;border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 18px 0 calc(18px + .36em);border-radius:999px;border:1px solid rgba(214,178,94,.55);background:linear-gradient(180deg,rgba(214,178,94,.10),rgba(214,178,94,.02));font-size:11px;font-weight:600;letter-spacing:.36em;white-space:nowrap;color:#fff;box-shadow:0 0 24px rgba(214,178,94,.08) inset}
#back,.tb{position:absolute;bottom:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
#back{left:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#back.on{opacity:1;pointer-events:auto}
#back .i,.tb .i{width:24px;height:24px}
#bSearch{right:50px} #bLib{right:6px}
@media (max-width:420px){#top .logo{font-size:10px;letter-spacing:.3em;padding:0 14px 0 calc(14px + .3em);height:28px}#bSearch{right:44px}#bLib{right:2px}#back{left:2px}}

/* layout */
#app{position:fixed;top:var(--top);left:0;right:0;bottom:0;display:flex}
#left{display:none}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
#view{max-width:720px;margin:0 auto;padding:14px 22px calc(70px + env(safe-area-inset-bottom))}
@media (min-width:900px){
  #left{display:block;width:330px;flex:none;border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 40px}
  #view{padding:22px 44px 90px}
  .only-narrow{display:none}
}
.slide-f{animation:slf .34s cubic-bezier(.2,.8,.2,1)}
.slide-b{animation:slb .34s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fd .35s ease}
@keyframes slf{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slb{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* left pane */
.lhead{position:sticky;top:0;background:#000;padding:18px 6px 10px;z-index:2}
.ltitle{font-size:24px;font-weight:700;letter-spacing:-.01em}
.lup{display:block;width:100%}
.lup small{display:block;font-size:12px;color:var(--t3);margin:0 0 4px 22px}
.lup span{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:700;color:#fff}
.lup .i{width:18px;height:18px;color:var(--gold);flex:none}

/* rows */
.list{border-top:1px solid var(--line);margin:4px 0 26px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);transition:background .15s}
.row:active{background:rgba(255,255,255,.05)}
.row .ic{width:24px;height:24px;color:var(--gold);flex:none}
.row .tx{flex:1;min-width:0;display:block}
.row .t{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;line-height:1.3}
.row .sub{display:block;font-size:14px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{width:16px;height:16px;color:var(--t3);flex:none}
.row .cnt{font-size:13px;color:var(--t3);font-variant-numeric:tabular-nums}
.row .soon{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.row .done{width:18px;height:18px;color:var(--gold);flex:none}
.lvt{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:500;white-space:nowrap}
.row.cpt{padding:12px 8px;border-radius:10px;border-bottom-color:transparent;margin:1px 0}
.row.cpt .t{font-size:15.5px}
.row.cpt .ic{width:20px;height:20px}
#left .list{border-top:0}
.row.act{background:var(--gd)}
.row.act .t{color:var(--gold2)}

/* home */
.big{font-size:40px;font-weight:750;letter-spacing:-.025em;margin:8px 0 18px}
.sbar{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 14px;border-radius:12px;background:#111113;border:1px solid var(--line);color:var(--t3);font-size:16px}
.sbar .i{width:19px;height:19px;flex:none}
.wod{margin:22px 0 14px;padding:22px 22px 18px;border-radius:18px;border:1px solid rgba(214,178,94,.35);background:radial-gradient(120% 140% at 0% 0%,rgba(214,178,94,.16),rgba(214,178,94,.02) 55%,transparent);cursor:pointer;animation:fd .6s ease}
.wod:active{transform:scale(.99)}
.wl{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.wl .i{width:15px;height:15px}
.wt{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:12px 0 2px}
.wf{font-size:14px;color:var(--t2);font-style:italic}
.ws{font-size:17px;line-height:1.5;margin-top:10px;color:#fff}
.wr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--t3)}
.wr b{display:flex;align-items:center;gap:5px;color:var(--gold);font-weight:600;white-space:nowrap}
.wr b .i{width:15px;height:15px}
.rnd{display:flex;align-items:center;gap:14px;width:100%;padding:16px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px}
.rnd .ic{width:24px;height:24px;color:var(--gold)} .rnd .tx{flex:1;min-width:0} .rnd .t{display:block;font-size:17px;font-weight:500} .rnd .sub{display:block;font-size:14px;color:var(--t2);margin-top:3px} .rnd .chev{width:16px;height:16px;color:var(--t3)}
.lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);font-weight:600;margin:6px 0 10px}
.foot{text-align:center;color:var(--t3);font-size:12.5px;margin-top:10px}

/* folder */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--t3);margin:2px 0 16px}
.crumbs button{color:var(--gold);opacity:.9}
.crumbs .sep{opacity:.6}
.fh{margin-bottom:18px}
.fic{display:block;width:34px;height:34px;color:var(--gold);margin-bottom:12px}
.pt{font-size:34px;line-height:1.12;font-weight:750;letter-spacing:-.022em;margin:8px 0 6px}
.fd{font-size:17px;line-height:1.5;color:var(--t2);margin:6px 0}
.fm{font-size:13px;color:var(--t3);margin:8px 0 0;letter-spacing:.02em}
.soonbox{text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:18px;margin-top:10px}
.soonbox .i{width:34px;height:34px;color:var(--gold);margin:0 auto 14px}
.soonbox h3{margin:0 0 8px;font-size:19px} .soonbox p{color:var(--t2);margin:0;line-height:1.5}

/* page */
.lvl{display:inline-block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(214,178,94,.5);border-radius:999px;padding:4px 11px;font-weight:600}
.ff{color:var(--t2);font-size:15.5px;font-style:italic;margin:4px 0 0;line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.act{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--t2);transition:all .2s}
.act .i{width:16px;height:16px}
.act.on{color:var(--gold2);border-color:rgba(214,178,94,.55);background:var(--gd)}
.act.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.one{margin:22px 0 6px;padding:16px 18px;border-left:2px solid var(--gold);background:linear-gradient(90deg,var(--gd),transparent 85%);border-radius:0 14px 14px 0}
.one>span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.one p{margin:0;font-size:19px;line-height:1.5;font-weight:500}
.sec{margin-top:32px}
.sec h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 12px}
.prose p{font-size:17.5px;line-height:1.68;margin:0 0 14px}
.formula{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15.5px;line-height:1.7;padding:16px 18px;border:1px solid rgba(214,178,94,.35);border-radius:14px;color:var(--gold2);background:#0a0906;white-space:pre-wrap;overflow-x:auto}
ul.k,ul.x{list-style:none;padding:0;margin:0}
ul.k li,ul.x li{position:relative;padding-left:22px;margin:0 0 11px;font-size:17px;line-height:1.6}
ul.k li:before{content:'';position:absolute;left:4px;top:.66em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
ul.x li:before{content:'×';position:absolute;left:3px;top:-.02em;color:var(--red);font-size:19px;font-weight:300}
.tw{color:var(--gold2);border-bottom:1px dotted rgba(240,213,140,.55);cursor:pointer}
.dg{margin:22px 0 4px;padding:16px 14px 12px;border:1px solid var(--line);border-radius:16px;background:#060606}
.dg svg{display:block;width:100%;height:auto;max-height:260px}
.dg figcaption{font-size:13px;color:var(--t3);text-align:center;margin-top:8px}
.tbl{margin:22px 0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:#0b0a07;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);line-height:1.45;vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.cap{font-size:13px;color:var(--t3);margin:8px 2px 0}
.endnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.pn{display:flex;align-items:center;gap:10px;max-width:48%;color:#fff;font-size:15px;font-weight:500;line-height:1.3}
.pn small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.pn .i{width:18px;height:18px;color:var(--gold);flex:none}
.pn.nx{margin-left:auto;text-align:right}

/* library */
.prog{height:4px;border-radius:4px;background:#1a1a1c;overflow:hidden;margin:14px 0 22px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#a9873a,var(--gold2));border-radius:4px}
.seg{display:flex;padding:3px;border-radius:11px;background:#141416;margin-bottom:16px}
.seg button{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-size:14px;color:var(--t2);font-weight:500}
.seg button.on{background:#2a2a2d;color:#fff}
.empty{color:var(--t3);text-align:center;padding:30px 10px 36px;line-height:1.5}
.tog{width:46px;height:28px;border-radius:999px;background:#2a2a2d;position:relative;flex:none;transition:background .2s}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--gold)} .tog.on i{transform:translateX(18px)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:fd .25s}
.scard{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:84vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#111113;border:1px solid rgba(214,178,94,.22);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 24px calc(30px + env(safe-area-inset-bottom));animation:up .34s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 18px}
.sh{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:12px 0 4px}
.ss{font-size:18px;line-height:1.55;margin:14px 0 8px}
.sp{font-size:13px;color:var(--t3);margin:0 0 20px}
.open{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;background:var(--gold);color:#000;font-weight:650;font-size:16px}
.open .i{width:18px;height:18px}
.qq{margin-top:22px}
.qt{font-size:17px;font-weight:600;line-height:1.45;margin:0 0 10px}
.qo{display:block;width:100%;padding:13px 16px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:#18181a;font-size:16px;line-height:1.35;transition:all .2s}
.qo:disabled{cursor:default}
.qo.ok{border-color:var(--green);background:rgba(62,207,142,.12);color:#c9f5df}
.qo.bad{border-color:var(--red);background:rgba(255,95,87,.12);color:#ffd2cf}
.qw{font-size:15px;line-height:1.5;color:var(--t2);margin:4px 2px 0}
.qs{margin-top:24px;padding:16px;border-radius:14px;text-align:center;background:var(--gd);color:var(--gold2);font-size:17px}

/* search */
#search{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
#search.on{display:flex;animation:fd .2s}
.shd{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.sin{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:#151517}
.sin .i{width:18px;height:18px;color:var(--t3);flex:none}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:17px}
#qx{color:var(--gold);font-size:16px}
#qr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 40px;max-width:760px;width:100%;margin:0 auto}
.hint{color:var(--t3);line-height:2.2;font-size:15px}
.chip{display:inline-block;padding:5px 12px;margin:0 6px 0 0;border-radius:999px;border:1px solid var(--line);color:#fff;font-size:14px;line-height:1.4}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.sp-logo{position:absolute;top:calc(13px + env(safe-area-inset-top));opacity:0}
.run .sp-logo{animation:spl .6s ease .95s forwards}
.sp-chart{width:min(72vw,440px);height:auto;overflow:visible}
#sp-path{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(214,178,94,.85))}
.run #sp-path{animation:draw 1s cubic-bezier(.65,0,.25,1) forwards}
.sp-dot{fill:var(--gold2);opacity:0;transform-origin:300px 8px}
.run .sp-dot{animation:dot .6s ease .9s forwards}
.sp-glow{opacity:0}
.run .sp-glow{animation:glow 1.2s ease .85s forwards}
.sp-title{display:flex;font-size:46px;font-weight:750;letter-spacing:-.025em;margin:30px 0 0;color:#fff}
.sp-title span{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(10px)}
.run .sp-title span{animation:let .6s cubic-bezier(.2,.8,.2,1) forwards}
.sp-line{height:1px;width:0;margin-top:16px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.run .sp-line{animation:line .8s ease 1.15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dot{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{0%{opacity:0}40%{opacity:.9}100%{opacity:.35}}
@keyframes let{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes line{to{width:180px}}
@keyframes spl{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
body:not(.ready) #app,body:not(.ready) #top{opacity:0}
body.ready #app,body.ready #top{opacity:1;transition:opacity .5s ease}
</style>
</head>
<body>
<div id="splash">
  <div class="logo sp-logo">JSR ENTERPRISES</div>
  <svg class="sp-chart" viewBox="0 0 300 120">
    <defs><radialGradient id="g1"><stop offset="0" stop-color="#f0d58c" stop-opacity=".6"/><stop offset="1" stop-color="#d6b25e" stop-opacity="0"/></radialGradient></defs>
    <circle class="sp-glow" cx="300" cy="8" r="34" fill="url(#g1)"/>
    <path id="sp-path" d="M0,104 L34,92 L58,98 L92,70 L118,80 L152,52 L176,60 L210,34 L236,42 L268,18 L300,8"/>
    <circle class="sp-dot" cx="300" cy="8" r="4.5"/>
  </svg>
  <h1 class="sp-title"></h1>
  <div class="sp-line"></div>
</div>

<header id="top">
  <button id="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="logo">JSR ENTERPRISES</div>
  <button id="bSearch" class="tb" aria-label="Search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5"/></svg></button>
  <button id="bLib" class="tb" aria-label="My Library"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4z M10 4h4v16h-4z M15.5 5.5l3.8-1 3.7 15.5-3.8 1z"/></svg></button>
</header>

<div id="app"><aside id="left"></aside><main id="main"><div id="view"></div></main></div>

<div id="sheet"><div class="sbg"></div><div class="scard"></div></div>

<div id="search">
  <div class="shd"><div class="sin"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5"/></svg><input id="q" type="search" placeholder="Search any word" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div><button id="qx">Cancel</button></div>
  <div id="qr"></div>
</div>

<script>
// ===== Content store + icons + diagrams =====
const C = {};

const ICONS = {
  chart: 'M3 3v18h18 M7 15l4-4 3 3 5-6',
  book: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z M4 19V5 M8 7h7',
  scope: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5 M8 13l2-2 2 1 2-3',
  candle: 'M7 3v4 M7 17v4 M5 7h4v10H5z M17 3v6 M17 15v6 M15 9h4v6h-4z',
  wave: 'M2 15c2.5 0 3-7 5.5-7S10 17 12.5 17 15 7 17.5 7 20 13 22 13',
  layers: 'M12 3l9 5-9 5-9-5z M3 12.5l9 5 9-5 M3 17l9 5 9-5',
  shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4',
  mind: 'M9 18h6 M10 21h4 M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z',
  pie: 'M12 3a9 9 0 1 0 9 9h-9z M15 3.5A9 9 0 0 1 20.5 9H15z',
  briefcase: 'M3 8h18v12H3z M8 8V5h8v3 M3 13h18',
  globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M3 12h18 M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z',
  wallet: 'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l12-3v3 M16 13.5h2',
  btc: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M10 7.5v9 M10 8h3a2 2 0 0 1 0 4h-3 M10 12h3.5a2.2 2.2 0 0 1 0 4.5H10 M11.5 6v1.5 M11.5 16.5V18',
  ledger: 'M5 3h14v18H5z M9 7h6 M9 11h6 M9 15h4',
  bank: 'M3 10l9-6 9 6 M5 10v8 M9.5 10v8 M14.5 10v8 M19 10v8 M3 20h18',
  rocket: 'M12 2c3 2 5 6 5 10l-2 4H9l-2-4c0-4 2-8 5-10z M12 8.5v.01 M9 16l-3 3 M15 16l3 3 M12 18v3',
  receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6',
  coins: 'M3 7c0-1.7 2.7-3 6-3s6 1.3 6 3-2.7 3-6 3-6-1.3-6-3z M3 7v5c0 1.7 2.7 3 6 3 M15 7v2 M9 14c0-1.7 2.7-3 6-3s6 1.3 6 3-2.7 3-6 3-6-1.3-6-3z M9 14v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4',
  back: 'M15 5l-7 7 7 7',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5',
  lib: 'M4 4h4v16H4z M10 4h4v16h-4z M15.5 5.5l3.8-1 3.7 15.5-3.8 1z',
  bookmark: 'M6 3h12v18l-6-4-6 4z',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  quiz: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5 M12 17h.01',
  dice: 'M4 4h16v16H4z M8.5 8.5h.01 M15.5 8.5h.01 M12 12h.01 M8.5 15.5h.01 M15.5 15.5h.01',
  chev: 'M9 6l6 6-6 6',
  close: 'M6 6l12 12 M18 6L6 18',
  sound: 'M4 9v6h4l5 4V5L8 9z M16.5 8.5a5 5 0 0 1 0 7',
  arrow: 'M5 12h14 M13 6l6 6-6 6',
  spark: 'M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.5 2.5 M15.5 15.5L18 18 M18 6l-2.5 2.5 M8.5 15.5L6 18',
  prev: 'M19 12H5 M11 6l-6 6 6 6'
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[n] || ''}"/></svg>`;

// ---------- Diagrams (small, clean SVG) ----------
const DG = (() => {
  const G = '#d6b25e', W = 'rgba(255,255,255,.88)', S = 'rgba(255,255,255,.3)', GR = '#3ecf8e', RD = '#ff5f57';
  const svg = (inner, h = 170) => `<svg viewBox="0 0 340 ${h}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,system-ui,sans-serif">${inner}</svg>`;
  const pts = (a) => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const pl = (a, c = W, w = 2, ex = '') => `<polyline points="${pts(a)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${ex}/>`;
  const ln = (x1, y1, x2, y2, c = S, w = 1, d = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${d ? `stroke-dasharray="${d}"` : ''}/>`;
  const tx = (x, y, s, c = S, sz = 10.5, a = 'middle', wt = 500) => `<text x="${x}" y="${y}" fill="${c}" font-size="${sz}" text-anchor="${a}" font-weight="${wt}">${s}</text>`;
  const rc = (x, y, w, h, f, s = 'none', r = 5) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}"/>`;
  const dot = (x, y, c = G, r = 3.5) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
  const range = (a, b, s) => { const r = []; for (let x = a; x <= b; x += s) r.push(x); return r; };

  // candle drawer: values 0..100 (100 = top)
  const candles = (list, opt = {}) => {
    const top = 14, H = 130, n = list.length, cw = Math.min(30, 220 / n), gap = (340 - n * cw) / (n + 1);
    const lo = Math.min(...list.map(c => c[2])), hi = Math.max(...list.map(c => c[1])), y = v => top + (hi - v) / ((hi - lo) || 1) * H;
    let s = '';
    list.forEach((c, i) => {
      const [o, h, l, cl, lab] = c; const x = gap + i * (cw + gap), mx = x + cw / 2;
      const col = cl > o ? GR : cl < o ? RD : W;
      s += ln(mx, y(h), mx, y(l), col, 1.6);
      const by = y(Math.max(o, cl)), bh = Math.max(2, Math.abs(y(o) - y(cl)));
      s += `<rect x="${x}" y="${by}" width="${cw}" height="${bh}" rx="2" fill="${col}" fill-opacity="${cl >= o ? .9 : .9}"/>`;
      if (lab) s += tx(mx, 162, lab, G, 10.5, 'middle', 600);
    });
    return svg(s);
  };

  const D = {
    candle() {
      const one = (x, bull) => {
        const col = bull ? GR : RD, hi = 18, lo = 150, bt = 48, bb = 112;
        let s = ln(x, hi, x, lo, col, 1.8) + rc(x - 17, bt, 34, bb - bt, col, 'none', 3);
        const lx = x + 30;
        s += ln(x + 4, hi, lx - 4, hi, S) + tx(lx, hi + 4, 'High', W, 10.5, 'start');
        s += ln(x + 19, bt, lx - 4, bt, S) + tx(lx, bt + 4, bull ? 'Close' : 'Open', W, 10.5, 'start');
        s += ln(x + 19, bb, lx - 4, bb, S) + tx(lx, bb + 4, bull ? 'Open' : 'Close', W, 10.5, 'start');
        s += ln(x + 4, lo, lx - 4, lo, S) + tx(lx, lo + 4, 'Low', W, 10.5, 'start');
        s += tx(x, 167, bull ? 'Bullish (green)' : 'Bearish (red)', G, 10.5, 'middle', 600);
        return s;
      };
      return svg(one(70, true) + one(235, false), 172);
    },
    candles(list) { return candles(list); },
    sr() {
      const p = [[10, 112], [48, 44], [88, 122], [132, 46], [172, 124], [216, 45], [258, 121], [300, 58], [330, 48]];
      return svg(ln(0, 42, 340, 42, G, 1.4, '5 4') + ln(0, 126, 340, 126, G, 1.4, '5 4') + pl(p) +
        tx(336, 34, 'Resistance — sellers', G, 10.5, 'end', 600) + tx(336, 143, 'Support — buyers', G, 10.5, 'end', 600));
    },
    trend() {
      const up = [[10, 140], [30, 110], [42, 122], [62, 88], [76, 102], [100, 60]];
      const sd = [[125, 90], [145, 70], [165, 108], [185, 72], [205, 106], [222, 80]];
      const dn = [[245, 55], [265, 88], [278, 74], [298, 110], [312, 98], [332, 140]];
      return svg(pl(up, GR) + pl(sd, W) + pl(dn, RD) + tx(55, 160, 'Uptrend', GR, 11, 'middle', 600) + tx(173, 160, 'Sideways', W, 11, 'middle', 600) + tx(290, 160, 'Downtrend', RD, 11, 'middle', 600));
    },
    struct() {
      const p = [[15, 145], [60, 100], [90, 122], [140, 72], [170, 97], [225, 46], [255, 72], [310, 20]];
      let s = pl(p);
      [[60, 100, 'HH'], [140, 72, 'HH'], [225, 46, 'HH']].forEach(([x, y, l]) => s += dot(x, y, GR) + tx(x, y - 9, l, GR, 10.5, 'middle', 700));
      [[90, 122, 'HL'], [170, 97, 'HL'], [255, 72, 'HL']].forEach(([x, y, l]) => s += dot(x, y, G) + tx(x, y + 18, l, G, 10.5, 'middle', 700));
      return svg(s);
    },
    bos() {
      const p = [[10, 135], [55, 82], [85, 106], [135, 56], [165, 86], [210, 40], [245, 96], [272, 74], [325, 145]];
      return svg(ln(55, 82, 140, 82, GR, 1.2, '4 3') + tx(97, 76, 'BOS', GR, 10.5, 'middle', 700) +
        ln(165, 86, 300, 86, RD, 1.2, '4 3') + tx(190, 102, 'CHoCH', RD, 10.5, 'middle', 700) + pl(p) +
        tx(170, 162, 'Break up = trend continues · Break of last low = trend may change', S, 9.5));
    },
    trendline() {
      const p = [[20, 140], [60, 95], [110, 110], [150, 65], [200, 80], [240, 35], [290, 50], [325, 22]];
      return svg(ln(10, 143.3, 330, 36.7, G, 1.4) + ln(10, 111.7, 330, 5, G, 1, '5 4') + pl(p) +
        [[20, 140], [110, 110], [200, 80], [290, 50]].map(([x, y]) => dot(x, y)).join('') + tx(250, 140, 'Trendline joins higher lows', G, 10.5, 'middle', 600));
    },
    ma() {
      const xs = range(10, 330, 8), pr = xs.map(x => 125 - x * .22 + 14 * Math.sin(x / 14) + 6 * Math.sin(x / 5));
      const ma = pr.map((_, i) => { const a = pr.slice(Math.max(0, i - 5), i + 1); return a.reduce((s, v) => s + v, 0) / a.length; });
      return svg(pl(xs.map((x, i) => [x, pr[i]]), S, 1.6) + pl(xs.map((x, i) => [x, ma[i]]), G, 2.4) +

  q:[[`When does the normal NSE session start?`,[`9:00 AM`,`9:15 AM`,`10:00 AM`],1,`Normal trading starts at 9:15 AM, after the pre-open session.`],[`When does the normal session end?`,[`3:00 PM`,`3:30 PM`,`4:00 PM`],1,`It ends at 3:30 PM.`]] },

'bull-bear': { t:`Bull and Bear Market`, lv:'B', al:[`bull market`,`bear market`,`bullish`,`bearish`,`bull`,`bear`],
  s:`Bull market = prices rising for a long time. Bear market = prices falling for a long time.`,
  ex:[`A bull attacks by pushing its horns up — so rising markets are "bullish". A bear swipes its paws down — so falling markets are "bearish".`,
      `A common rule: a fall of 20% or more from the top is called a bear market. A fall of 10–20% is called a correction. A bullish trader expects prices to rise; a bearish trader expects them to fall.`],
  dg:'trend',
  tb:{h:[`Word`,`Meaning`],r:[[`Bull market`,`Long rise, optimism, buying`],[`Bear market`,`Fall of 20%+, fear, selling`],[`Correction`,`Fall of about 10–20%`],[`Sideways`,`No clear direction`]]},
  eg:[`In 2020 markets crashed about 38% in weeks (bear), then went on a strong multi-year rise (bull).`],
  use:[`In a bull market, buy dips in strong shares. In a bear market, protect capital and be selective.`],
  mis:[`Assuming a bull market will last forever and using too much leverage.`],
  key:[`Bull = up. Bear = down.`,`Bear market = fall of 20% or more.`,`Correction = 10–20% fall.`],
  rel:['trend','market-structure','trading-psychology'],
  q:[[`A trader expecting prices to fall is…`,[`Bullish`,`Bearish`],1,`Bearish = expecting a fall.`],[`A 12% fall from the top is usually called a…`,[`Bear market`,`Correction`,`Crash`],1,`10–20% is a correction; 20%+ is a bear market.`]] },

'market-cap': { t:`Market Capitalisation`, lv:'B', ff:`Market Cap`, al:[`market cap`,`market capitalisation`,`market capitalization`,`large cap`,`mid cap`,`small cap`,`largecap`,`midcap`,`smallcap`],
  s:`The total market value of a company = share price × total number of shares.`,
  ex:[`Market cap tells you how big a company is in the eyes of the market. It is the price you would pay to buy every single share.`,
      `In India, SEBI groups companies by rank: the top 100 by market cap are large caps, ranks 101–250 are mid caps, and 251 onwards are small caps. Large caps are usually safer; small caps can grow faster but swing more.`],
  f:`Market Cap = Share Price × Total Shares`,
  tb:{h:[`Type`,`Rank (India)`,`Nature`],r:[[`Large cap`,`1 – 100`,`Stable, well known`],[`Mid cap`,`101 – 250`,`Growing, medium risk`],[`Small cap`,`251 onwards`,`High growth, high risk`]]},
  eg:[`Share price ₹500, total shares 20 crore → Market cap = ₹500 × 20 crore = ₹10,000 crore.`],
  use:[`Compare companies by market cap, not by share price.`,`Balance your portfolio between large, mid and small caps based on your risk.`],
  mis:[`Comparing two companies only by share price instead of market cap.`],
  key:[`Market cap = price × shares.`,`Large cap = top 100 companies.`,`Smaller caps = more risk and more potential.`],
  rel:['share','index','pe'],
  q:[[`Price ₹100, shares 50 crore. Market cap?`,[`₹500 crore`,`₹5,000 crore`,`₹50,000 crore`],1,`₹100 × 50 crore = ₹5,000 crore.`],[`In India, a company ranked 150 by market cap is a…`,[`Large cap`,`Mid cap`,`Small cap`],1,`Ranks 101–250 are mid caps.`]] },

'order-types': { t:`Market vs Limit Order`, lv:'B', al:[`market order`,`limit order`,`order types`],
  s:`A market order buys or sells at the current price instantly. A limit order waits for your chosen price.`,
  ex:[`A **market order** says "fill me now at the best available price". It is fast, but in a fast or thin market you may get a worse price than you saw (this gap is called slippage).`,
      `A **limit order** says "only buy at this price or lower" (or "only sell at this price or higher"). You control the price, but the order may never fill if the market doesn't reach it.`],
  tb:{h:[`Order`,`Speed`,`Price control`,`Best for`],r:[[`Market`,`Instant`,`None`,`Highly liquid shares, urgent exits`],[`Limit`,`May wait or not fill`,`Full`,`Planned entries, less liquid shares`]]},
  eg:[`A share trades at ₹200. You place a limit buy at ₹195. It fills only if someone sells at ₹195 or lower. A market buy would fill near ₹200 immediately.`],
  use:[`Use limit orders for entries to avoid paying extra.`,`Use market orders for urgent exits when a stop is hit.`],
  mis:[`Using market orders in illiquid small caps and getting a much worse price.`],
  key:[`Market = speed. Limit = price control.`,`Slippage happens with market orders in fast markets.`],
  rel:['sl-order','bid-ask','volume'],
  q:[[`Which order guarantees your price but not the fill?`,[`Market order`,`Limit order`],1,`A limit order fills only at your price or better.`],[`Getting a worse price than expected is called…`,[`Slippage`,`Spread`,`Premium`],0,`Slippage = difference between expected and actual fill price.`]] },

'sl-order': { t:`Stop-Loss Order`, lv:'B', ff:`SL and SL-M orders`, al:[`stop-loss`,`stop loss`,`stoploss`,`SL`,`SL-M`,`trailing stop`],
  s:`An order that automatically exits your trade when price hits a level you choose, to limit loss.`,
  ex:[`A stop-loss is your safety net. You decide before entering: "If price falls to X, I am wrong — get me out."`,
      `In India there are two types. **SL (stop-loss limit):** when the trigger price is hit, a limit order is placed. **SL-M (stop-loss market):** when the trigger is hit, a market order is placed, so you exit for sure but maybe at a slightly worse price.`,
      `A **trailing stop** moves up as price moves in your favour, locking in profit.`],
  tb:{h:[`Type`,`After trigger`,`Risk`],r:[[`SL`,`Limit order placed`,`May not fill in a fast fall`],[`SL-M`,`Market order placed`,`Fills, but with some slippage`]]},
  eg:[`You buy at ₹500 and set SL-M trigger at ₹480. If price touches ₹480, you are sold out near ₹480. Your loss is limited to about ₹20 per share.`],
  use:[`Place the stop where your trade idea is proven wrong — e.g. just below support.`,`Decide position size from the stop distance.`],
  mis:[`Moving the stop further away when price comes near it.`,`Placing stops at very obvious round numbers where many others place them.`],
  key:[`Decide the stop before entering.`,`SL-M exits for sure; SL may not fill.`,`A stop protects capital — it is not a sign of weakness.`],
  rel:['position-sizing','risk-reward','sr','liquidity-sweep'],
  q:[[`Which stop type is sure to exit once triggered?`,[`SL`,`SL-M`],1,`SL-M sends a market order, so it fills.`],[`When should you decide the stop-loss level?`,[`After entering`,`Before entering`],1,`Always plan the stop before you enter.`]] },

'intraday-delivery': { t:`Intraday vs Delivery`, lv:'B', al:[`intraday`,`delivery`,`MIS`,`CNC`,`day trading`,`swing trading`,`positional`],
  s:`Intraday = buy and sell on the same day. Delivery = buy and keep the shares for days or years.`,
  ex:[`In **intraday** trading (often called MIS on broker apps), all positions must be closed before the market ends. Brokers give some leverage, so small moves can mean big profits or losses.`,
      `In **delivery** (often called CNC), you pay the full amount and the shares go into your demat account. You can hold as long as you like. Swing traders hold for days to weeks; investors hold for years.`],
  tb:{h:[`Style`,`Holding time`,`Risk`],r:[[`Scalping`,`Seconds – minutes`,`Very high`],[`Intraday`,`Same day`,`High`],[`Swing`,`Days – weeks`,`Medium`],[`Positional / Investing`,`Months – years`,`Lower (if quality)`]]},
  eg:[`You buy 100 shares at 10:00 AM and sell at 2:00 PM → intraday. You buy 100 shares and hold for 2 years → delivery.`],
  use:[`Pick one style that suits your time and temperament, and master it.`],
  mis:[`Converting a losing intraday trade into delivery just to avoid booking the loss.`],
  key:[`Intraday must be closed the same day.`,`Delivery puts shares in your demat.`,`Leverage increases both gains and losses.`],
  rel:['timings','lot-margin','trading-plan'],
  q:[[`A trade opened and closed on the same day is…`,[`Delivery`,`Intraday`],1,`Same-day buy and sell = intraday.`],[`Holding a position for 2 weeks is called…`,[`Scalping`,`Swing trading`,`Intraday`],1,`Days to weeks = swing trading.`]] },

'bid-ask': { t:`Bid, Ask & Spread`, lv:'I', al:[`bid`,`ask`,`spread`,`bid-ask spread`,`order book`,`market depth`],
  s:`Bid = highest price a buyer will pay. Ask = lowest price a seller will accept. The gap between them is the spread.`,
  ex:[`The order book (market depth) shows waiting buyers on one side and waiting sellers on the other. When you buy with a market order, you pay the ask. When you sell, you get the bid.`,
      `A small spread means the share is liquid and cheap to trade. A wide spread means fewer participants — you lose more just by entering and exiting.`],
  tb:{h:[`Bid (buyers)`,`Qty`,`Ask (sellers)`,`Qty`],r:[[`₹199.90`,`1,200`,`₹200.00`,`900`],[`₹199.85`,`3,400`,`₹200.05`,`2,100`],[`₹199.80`,`2,800`,`₹200.10`,`1,500`]],c:`Spread here = ₹200.00 − ₹199.90 = ₹0.10`},
  f:`Spread = Ask − Bid`,
  eg:[`A small cap shows bid ₹98 and ask ₹100. If you buy at ₹100 and immediately sell at ₹98, you lose 2% instantly — that's the spread cost.`],
  use:[`Prefer shares with tight spreads for intraday trading.`,`Use limit orders in wide-spread shares.`],
  mis:[`Ignoring the spread in illiquid shares and options.`],
  key:[`You buy at the ask and sell at the bid.`,`Tight spread = liquid.`,`Spread is a hidden trading cost.`],
  rel:['order-types','volume','oi-pcr'],
  q:[[`Bid ₹50.00, Ask ₹50.20. Spread?`,[`₹0.02`,`₹0.20`,`₹2`],1,`50.20 − 50.00 = ₹0.20.`],[`When you place a market buy, you usually pay the…`,[`Bid`,`Ask`],1,`Market buys take the lowest ask.`]] },

'volume': { t:`Volume & Liquidity`, lv:'B', al:[`volume`,`liquidity`,`liquid`,`illiquid`,`average volume`],
  s:`Volume = how many shares traded in a period. Liquidity = how easily you can buy or sell without moving the price.`,
  ex:[`Volume shows interest. A price move with big volume is more trustworthy than the same move with small volume, because many participants agreed with it.`,
      `Liquid shares (like Reliance or HDFC Bank) have huge daily volume and tight spreads. Illiquid shares can be hard to exit — sometimes you can't sell at all when you want to.`],
  tb:{h:[`Price move`,`Volume`,`Meaning`],r:[[`Up`,`High`,`Strong buying — trend likely real`],[`Up`,`Low`,`Weak move — be careful`],[`Down`,`High`,`Strong selling`],[`Down`,`Low`,`Weak selling, maybe just a pause`]]},
  eg:[`A share breaks above ₹500 with 3× its normal volume — strong breakout. The same break with half the normal volume is more likely to fail.`],
  use:[`Confirm breakouts with rising volume.`,`Avoid trading shares with very low average volume.`],
  mis:[`Buying small illiquid shares and getting stuck when trying to sell.`],
  key:[`Volume confirms price.`,`Liquidity = easy entry and exit.`,`Low liquidity = wide spreads and slippage.`],
  rel:['bid-ask','breakout','volume-profile','vwap'],
  q:[[`A breakout with very low volume is…`,[`More reliable`,`Less reliable`],1,`Low volume means little participation — more likely to fail.`],[`Liquidity means…`,[`How much profit a company makes`,`How easily you can buy or sell`],1,`Liquidity is about ease of trading.`]] },

'circuit': { t:`Upper & Lower Circuit`, lv:'I', al:[`circuit`,`upper circuit`,`lower circuit`,`circuit limit`,`price band`],
  s:`The maximum % a share is allowed to rise or fall in one day. When it hits that limit, it is "locked".`,
  ex:[`Exchanges set price bands (commonly 2%, 5%, 10% or 20%) on many shares to stop crazy moves. At the upper circuit, there are only buyers and no sellers. At the lower circuit, only sellers and no buyers.`,
      `Shares that are part of the F&O segment usually have no fixed daily band but have dynamic limits. The whole market also has index-wide circuit breakers (at 10%, 15% and 20% moves) that pause trading.`],
  eg:[`A small cap with a 5% band closes at ₹100. Next day it can trade only between ₹95 and ₹105. If bad news hits, it may be stuck at ₹95 with no buyers — you cannot sell.`],
  use:[`Be careful with small caps that often hit circuits — you may be unable to exit.`],
  mis:[`Chasing shares stuck at the upper circuit, hoping to get in — they often reverse sharply later.`],
  key:[`Circuit = daily price limit.`,`Upper circuit = only buyers. Lower = only sellers.`,`Frequent circuits = liquidity risk.`],
  rel:['volume','bid-ask','risk-management'],
  q:[[`Share closes at ₹200 with a 10% band. Max price next day?`,[`₹210`,`₹220`,`₹240`],1,`10% of ₹200 = ₹20, so ₹220.`],[`At the lower circuit there are…`,[`Only buyers`,`Only sellers`],1,`Lower circuit = sellers waiting, no buyers.`]] },

'settlement': { t:`T+1 Settlement`, lv:'I', al:[`T+1`,`settlement`,`T+0`],
  s:`After you buy shares, they reach your demat account by the next working day (Trade day + 1).`,
  ex:[`"T" is the trade day. India moved to T+1 settlement in 2023 — one of the fastest in the world. Buy on Monday → shares in your demat on Tuesday. Sell on Monday → money available on Tuesday.`,
      `A same-day (T+0) settlement option has also been introduced for some shares. Settlement days skip weekends and market holidays.`],
  eg:[`You sell shares on Friday. With T+1, the money is settled on Monday (the next working day), not Saturday.`],
  use:[`Plan cash needs around settlement — sale money is not instantly withdrawable.`],
  mis:[`Thinking you can sell shares bought today in delivery before they reach your demat — most brokers allow it (BTST), but it carries extra risk if the seller fails to deliver.`],
  key:[`T = trade day.`,`T+1 = settled next working day.`,`Weekends and holidays don't count.`],
  rel:['demat','intraday-delivery'],
  q:[[`You buy on Thursday (no holiday). Shares arrive…`,[`Thursday`,`Friday`,`Monday`],1,`T+1 → next working day = Friday.`]] },

'ipo': { t:`IPO`, lv:'B', ff:`Initial Public Offering`, al:[`IPO`,`IPOs`,`initial public offering`,`listing`,`GMP`,`grey market premium`],
  s:`When a private company sells its shares to the public for the first time and lists on the stock exchange.`,
  ex:[`Through an IPO, a company raises money to grow, pay debt, or let early owners sell part of their stake. After the IPO, the shares trade daily on NSE/BSE.`,
      `Before investing, read the RHP (Red Herring Prospectus): what the business does, how it will use the money, its profits and risks. You apply via UPI through your broker; if more people apply than shares available (oversubscribed), shares are allotted by lottery.`,
      `GMP (grey market premium) is an unofficial price people talk about before listing. It is not regulated and can be misleading.`],
  tb:{h:[`Part`,`Meaning`],r:[[`Fresh issue`,`New shares — money goes to the company`],[`OFS (Offer for Sale)`,`Old owners sell — money goes to them, not the company`],[`Price band`,`Range you can bid in, e.g. ₹300–₹315`],[`Listing day`,`First day of trading on the exchange`]]},
  eg:[`An IPO is priced at ₹315 and lists at ₹380 — a 21% listing gain. But many IPOs list below their issue price, and some fall for years after.`],
  use:[`Prefer IPOs where most money is a fresh issue used for growth, not just OFS.`,`Compare valuation (P/E) with listed peers.`],
  mis:[`Applying to every IPO only because of hype or a high GMP.`],
  key:[`IPO = first public sale of shares.`,`Read the RHP before applying.`,`Fresh issue helps the company; OFS helps old owners.`],
  rel:['stock-market','pe','promoter'],
  q:[[`In an OFS, the money goes to…`,[`The company`,`Existing shareholders who sell`],1,`OFS = existing owners selling. Fresh issue money goes to the company.`],[`Is GMP regulated by SEBI?`,[`Yes`,`No`],1,`GMP is an unofficial, unregulated number.`]] },

'dividend': { t:`Dividend`, lv:'B', al:[`dividend`,`dividends`,`record date`,`ex-date`,`ex-dividend`],
  s:`A part of the company's profit paid out in cash to its shareholders.`,
  ex:[`When a company earns profit, it can keep it to grow (retained earnings) or share some with owners as a dividend. Dividends are declared per share, e.g. ₹10 per share.`,
      `To get a dividend, you must hold the share before the **ex-date**. On the ex-date, the share price usually drops by about the dividend amount, because that cash is leaving the company.`],
  f:`Dividend received = Dividend per share × Number of shares`,
  eg:[`ITC declares ₹6 per share. You hold 500 shares → you receive ₹3,000 (before tax).`],
  use:[`Mature companies (FMCG, utilities) often pay steady dividends.`,`Growing companies often pay little because they reinvest profits — that's not bad.`],
  mis:[`Buying just before the ex-date to "earn" the dividend — the price drop usually cancels it.`],
  key:[`Dividend = share of profit paid in cash.`,`Must hold before the ex-date.`,`Price drops by about the dividend on ex-date.`],
  rel:['div-yield','eps','buyback'],
  q:[[`₹4 dividend per share, you own 250 shares. You get…`,[`₹250`,`₹1,000`,`₹4,000`],1,`₹4 × 250 = ₹1,000.`],[`On the ex-date, the share price usually…`,[`Rises by the dividend`,`Falls by about the dividend`],1,`The cash leaves the company, so price adjusts down.`]] },

'split-bonus': { t:`Stock Split & Bonus`, lv:'B', al:[`stock split`,`split`,`bonus`,`bonus issue`,`bonus shares`,`face value`],
  s:`Both increase the number of shares you hold and lower the price per share — your total value stays the same.`,
  ex:[`In a **stock split**, one share is cut into smaller pieces. A 1:5 split turns 1 share of face value ₹10 into 5 shares of ₹2 each. The price becomes about one-fifth.`,
      `In a **bonus issue**, the company gives free extra shares from its reserves. A 1:1 bonus gives 1 extra share for every share held, and the price roughly halves.`,
      `Neither creates new value. They mainly make the share price more affordable and increase liquidity.`],
  tb:{h:[``,`Before`,`After 1:1 bonus`,`After 1:5 split`],r:[[`Shares`,`100`,`200`,`500`],[`Price`,`₹1,000`,`₹500`,`₹200`],[`Total value`,`₹1,00,000`,`₹1,00,000`,`₹1,00,000`]]},
  eg:[`You own 10 shares at ₹2,000 (₹20,000). After a 1:2 split you own 20 shares at ₹1,000 — still ₹20,000.`],
  use:[`Don't buy only because of a split/bonus announcement — check the business.`],
  mis:[`Thinking a bonus or split makes you richer by itself.`],
  key:[`More shares, lower price, same value.`,`Split changes face value; bonus uses reserves.`,`Improves affordability and liquidity.`],
  rel:['share','market-cap','dividend'],
  q:[[`You hold 50 shares at ₹400. After a 1:1 bonus you hold…`,[`50 shares at ₹800`,`100 shares at ₹200`,`100 shares at ₹400`],1,`Shares double, price halves, value stays ₹20,000.`]] },

'buyback': { t:`Buyback`, lv:'I', al:[`buyback`,`share buyback`],
  s:`When a company buys its own shares back from shareholders, usually at a premium.`,
  ex:[`A buyback reduces the total number of shares. Each remaining share then owns a bigger slice of the profit, so EPS goes up.`,
      `Companies do buybacks when they have extra cash and feel their share is undervalued. It is a way to return cash to shareholders, like a dividend.`],
  eg:[`A company has 100 crore shares and buys back 5 crore. If profit stays the same, EPS rises about 5%.`],
  use:[`Repeated buybacks with strong cash flow often show confidence.`],
  mis:[`Ignoring companies that borrow money just to do buybacks — that adds risk.`],
  key:[`Fewer shares → higher EPS.`,`Signals management thinks the share is cheap.`,`Another way to return cash.`],
  rel:['eps','dividend','fcf'],
  q:[[`After a buyback, total shares…`,[`Increase`,`Decrease`],1,`The company cancels the shares it buys.`]] }
});

// ===== Fundamental Analysis =====
Object.assign(C, {
'fundamental-analysis': { t:`What is Fundamental Analysis`, lv:'B', al:[`fundamental analysis`,`fundamentals`],
  s:`Studying a company's business and financial numbers to find out what its share is really worth.`,
  ex:[`Fundamental analysis asks: "Is this a good business, and is its share price fair?" You look at sales, profit, debt, cash flow, management and the industry.`,
      `If your estimated value is higher than the market price, the share may be undervalued (a buy). If it is lower, it may be overvalued. Fundamentals matter most for investing over months and years. Sites like Screener.in show most of these numbers in one place.`],
  dg:['flow',[`Business|what it does`,`Numbers|sales, debt`,`Value|fair price`,`Decision|buy or wait`]],
  tb:{h:[`Check`,`Question it answers`],r:[[`Business model`,`How does it make money?`],[`Growth`,`Are sales and profit rising?`],[`Profitability`,`ROE, ROCE, margins — is it efficient?`],[`Debt`,`Can it survive bad years?`],[`Valuation`,`P/E, P/B — is the price fair?`],[`Management`,`Are promoters honest and capable?`]]},
  eg:[`Two companies both earn ₹100 crore profit. One has no debt and grows 20% a year; the other has heavy debt and flat sales. Fundamental analysis tells you the first deserves a higher price.`],
  use:[`Shortlist with filters (ROCE > 15%, debt/equity < 0.5, steady growth), then read the annual report of the best names.`],
  mis:[`Buying a "good company" at any price — even great businesses can be bad investments if bought too expensive.`],
  key:[`Business first, numbers second, price last.`,`Best for long-term investing.`,`Compare with peers in the same industry.`],
  rel:['intrinsic-value','income-statement','pe','technical-analysis'],
  q:[[`Fundamental analysis mainly studies…`,[`Chart patterns`,`The business and its numbers`],1,`Charts are technical analysis.`],[`Can a great company be a bad investment?`,[`Yes, if bought too expensive`,`No, never`],0,`Price paid matters as much as quality.`]] },

'intrinsic-value': { t:`Intrinsic Value & Margin of Safety`, lv:'I', al:[`intrinsic value`,`margin of safety`,`fair value`,`undervalued`,`overvalued`],
  s:`Intrinsic value is what a business is truly worth. Margin of safety is buying well below that value.`,
  ex:[`Market price changes every second with emotions. Intrinsic value is your calm estimate of what the business is worth, based on its future cash and profit.`,
      `Because no estimate is perfect, investors like Benjamin Graham and Warren Buffett buy only when the price is well below their value estimate. That gap is the margin of safety — it protects you if you are wrong.`],
  f:`Margin of Safety = (Intrinsic Value − Price) ÷ Intrinsic Value × 100`,
  eg:[`You value a share at ₹1,000. It trades at ₹700. Margin of safety = (1,000 − 700) ÷ 1,000 = 30%.`],
  use:[`Use a 20–40% margin of safety depending on how confident you are.`,`Estimate value with more than one method (P/E vs peers, DCF).`],
  mis:[`Treating your value estimate as exact — it is a range, not a number.`],
  key:[`Price is what you pay; value is what you get.`,`Margin of safety protects against mistakes.`],
  rel:['dcf','pe','moat'],
  q:[[`Value ₹500, price ₹400. Margin of safety?`,[`10%`,`20%`,`25%`],1,`(500 − 400) ÷ 500 = 20%.`]] },

'moat': { t:`Economic Moat`, lv:'I', al:[`moat`,`economic moat`,`competitive advantage`],
  s:`A strong, lasting advantage that protects a company's profits from competitors.`,
  ex:[`Like a moat around a castle, it keeps rivals out. Companies with a moat can keep high profits (high ROCE) for many years.`,
      `Common moats: a powerful brand, network effects, low cost, high switching costs, patents or licences.`],
  tb:{h:[`Moat type`,`Example`],r:[[`Brand`,`Asian Paints, Apple`],[`Network effect`,`NSE, Visa, Meta`],[`Low cost`,`DMart, Costco`],[`Switching cost`,`TCS clients, Microsoft Office`],[`Licence / patent`,`Exchanges, pharma patents`]]},
  eg:[`People keep buying Asian Paints even at higher prices because of brand trust and a huge dealer network — that's a moat.`],
  use:[`Look for ROCE above 15–20% for 10 years — a sign of a moat.`],
  mis:[`Calling a temporary trend (a hot product) a moat.`],
  key:[`Moat = lasting advantage.`,`Shows up as high, steady returns.`,`Moats can weaken — keep checking.`],
  rel:['roce','fundamental-analysis','margins'],
  q:[[`Which is a network-effect moat?`,[`A cheaper product`,`A platform that gets more useful as more people join`],1,`Network effect = more users, more value.`]] },

'income-statement': { t:`Profit & Loss Statement`, lv:'B', ff:`Income Statement / P&L`, al:[`P&L`,`profit and loss`,`profit & loss`,`income statement`,`revenue`,`net profit`,`PAT`],
  s:`A report showing how much a company sold, what it spent, and what profit it kept in a period.`,
  ex:[`The P&L starts at the top with revenue (sales) and subtracts costs step by step until you reach net profit at the bottom — also called PAT (profit after tax).`,
      `It's published every quarter and every year. Compare it over many periods: rising sales and profit is a good sign; rising sales with falling profit means costs are eating the business.`],
  dg:['flow',[`Revenue (sales)`,`− Operating expenses`,`= Operating profit (EBIT)`,`− Interest − Tax`,`= Net profit (PAT)`]],
  tb:{h:[`Line`,`Example (₹ crore)`],r:[[`Revenue`,`1,000`],[`− Expenses`,`800`],[`Operating profit`,`200`],[`− Interest`,`20`],[`− Tax`,`45`],[`Net profit`,`135`]],c:`Example numbers`},
  use:[`Check 5–10 years of sales and profit growth.`,`Watch "other income" — a big one-time gain can make profit look better than it is.`],
  mis:[`Looking at only one quarter.`,`Ignoring one-time gains or losses.`],
  key:[`Top line = revenue. Bottom line = net profit.`,`Profit ≠ cash — check the cash flow too.`],
  rel:['balance-sheet','cash-flow','margins','eps'],
  q:[[`The "bottom line" means…`,[`Revenue`,`Net profit`],1,`Net profit is at the bottom of the P&L.`],[`Revenue ₹500 cr, expenses ₹420 cr. Operating profit?`,[`₹80 cr`,`₹920 cr`],0,`500 − 420 = ₹80 crore.`]] },

'balance-sheet': { t:`Balance Sheet`, lv:'B', al:[`balance sheet`,`assets`,`liabilities`,`net worth`,`shareholders' equity`,`reserves`],
  s:`A snapshot of what a company owns (assets) and what it owes (liabilities) on one day.`,
  ex:[`The golden rule: **Assets = Liabilities + Equity**. Assets are things like factories, cash and stock. Liabilities are debts and bills to pay. Equity (net worth) is what belongs to shareholders.`,
      `The P&L shows a period like a movie; the balance sheet is a photo at the end of it. A strong balance sheet has low debt, good cash, and growing reserves.`],
  f:`Assets = Liabilities + Shareholders' Equity`,
  tb:{h:[`Assets (owns)`,`Liabilities + Equity (owes / owners)`],r:[[`Cash & bank`,`Borrowings (debt)`],[`Receivables (money due)`,`Payables (bills due)`],[`Inventory`,`Other liabilities`],[`Factories, machines`,`Share capital + Reserves = Equity`]]},
  eg:[`A company has assets of ₹1,000 crore and debt plus bills of ₹400 crore → equity = ₹600 crore.`],
  use:[`Check debt trend, cash, and whether receivables grow much faster than sales (warning sign).`],
  mis:[`Ignoring rising receivables — sales on credit that are never collected.`],
  key:[`Assets = Liabilities + Equity.`,`Snapshot on one date.`,`Low debt + rising reserves = strong.`],
  rel:['income-statement','cash-flow','debt-equity','pb'],
  q:[[`Assets ₹800 cr, liabilities ₹300 cr. Equity?`,[`₹500 cr`,`₹1,100 cr`],0,`800 − 300 = ₹500 crore.`]] },

'cash-flow': { t:`Cash Flow Statement`, lv:'I', al:[`cash flow`,`cash flow statement`,`operating cash flow`,`CFO`],
  s:`A report showing where cash actually came from and where it went.`,
  ex:[`Profit can be on paper; cash is real. A company may show profit but still run out of cash if customers don't pay.`,
      `Cash flow has three parts: **Operating** (from the main business), **Investing** (buying or selling assets like factories), and **Financing** (loans, share issues, dividends).`],
  tb:{h:[`Part`,`Healthy company usually shows`],r:[[`Operating (CFO)`,`Positive and close to net profit`],[`Investing (CFI)`,`Negative (it is investing to grow)`],[`Financing (CFF)`,`Negative (repaying debt, paying dividends)`]]},
  eg:[`Net profit ₹100 crore but operating cash flow only ₹20 crore for years → profit is not turning into cash. Red flag.`],
  use:[`Compare 5-year total operating cash flow with 5-year total net profit — they should be similar.`],
  mis:[`Trusting profit alone without checking cash.`],
  key:[`Cash is king — profit can be managed, cash is harder to fake.`,`Three parts: operating, investing, financing.`],
  rel:['fcf','income-statement','balance-sheet'],
  q:[[`Which part shows cash from the main business?`,[`Operating`,`Investing`,`Financing`],0,`Operating cash flow = cash from core business.`]] },

'eps': { t:`EPS`, lv:'B', ff:`Earnings Per Share`, al:[`EPS`,`earnings per share`],
  s:`The company's net profit divided by its total number of shares — profit earned by one share.`,
  ex:[`EPS tells you how much profit belongs to each share. Rising EPS over years usually drives the share price higher.`,
      `EPS can grow from higher profit or from fewer shares (buybacks). "Diluted EPS" counts extra shares that may be created later (like employee options).`],
  f:`EPS = Net Profit ÷ Total Shares`,
  eg:[`Net profit ₹500 crore, 50 crore shares → EPS = ₹10.`],
  use:[`Look for EPS rising steadily for 5+ years.`,`EPS is used to calculate P/E.`],
  mis:[`Comparing EPS of two companies directly — share counts differ, so compare growth and P/E instead.`],
  key:[`EPS = profit per share.`,`Steady EPS growth = good sign.`,`Used in P/E ratio.`],
  rel:['pe','income-statement','buyback'],
  q:[[`Profit ₹200 cr, shares 40 cr. EPS?`,[`₹5`,`₹8`,`₹20`],0,`200 ÷ 40 = ₹5.`]] },

'pe': { t:`P/E Ratio`, lv:'B', ff:`Price to Earnings Ratio`, al:[`P/E`,`PE ratio`,`P/E ratio`,`price to earnings`],
  s:`How many rupees investors pay for ₹1 of the company's yearly profit.`,
  ex:[`P/E is the most popular valuation ratio. A P/E of 20 means you pay ₹20 for every ₹1 of annual profit — or, if profit stays flat, 20 years to "earn back" the price.`,
      `High P/E means the market expects fast growth (or the share is expensive). Low P/E can mean cheap — or a business with problems. Always compare with the company's own past P/E and with peers in the same industry.`],
  f:`P/E = Share Price ÷ EPS\n   = Market Cap ÷ Net Profit`,
  tb:{h:[`P/E`,`Usually means`],r:[[`Below 10`,`Cheap — or the business is in trouble`],[`15 – 25`,`Fair for average growth`],[`Above 40`,`High growth expected — or overvalued`]],c:`Rough guide only. FMCG often trades at high P/E; banks and metals at lower P/E.`},
  eg:[`Share price ₹1,500, EPS ₹75 → P/E = 20. A peer with similar growth at P/E 30 looks more expensive.`],
  use:[`Compare P/E with industry peers and the company's 5-year average.`,`Pair it with growth using the PEG ratio.`],
  mis:[`Buying only because P/E is low — it may be a value trap.`,`Comparing P/E across very different industries.`],
  key:[`P/E = price ÷ EPS.`,`High P/E = high expectations.`,`Compare within the same industry.`],
  rel:['eps','peg','pb','ev-ebitda'],
  q:[[`Price ₹600, EPS ₹30. P/E?`,[`18`,`20`,`30`],1,`600 ÷ 30 = 20.`],[`A very low P/E always means a good buy?`,[`Yes`,`No`],1,`It can be a value trap with weak business.`]] },

'pb': { t:`P/B Ratio`, lv:'I', ff:`Price to Book Ratio`, al:[`P/B`,`PB ratio`,`price to book`,`book value`],
  s:`Compares the share price with the company's book value (net worth) per share.`,
  ex:[`Book value is what shareholders would get if the company sold all assets and paid all debts — roughly its equity. P/B tells you how much you pay for each ₹1 of net worth.`,
      `P/B is most useful for banks, NBFCs and asset-heavy companies. For brand or tech companies with few physical assets, P/B is less meaningful.`],
  f:`P/B = Share Price ÷ Book Value per Share\nBook Value per Share = Shareholders' Equity ÷ Total Shares`,
  eg:[`A bank's book value is ₹400 per share and it trades at ₹800 → P/B = 2.`],
  use:[`Use P/B with ROE: a high-ROE bank deserves a higher P/B.`],
  mis:[`Using P/B to value IT or FMCG companies.`],
  key:[`P/B < 1 = trading below net worth.`,`Best for banks and financial companies.`,`Read together with ROE.`],
  rel:['pe','roe','balance-sheet'],
  q:[[`Price ₹300, book value per share ₹150. P/B?`,[`0.5`,`2`,`4.5`],1,`300 ÷ 150 = 2.`],[`P/B is most useful for…`,[`Banks`,`Software companies`],0,`Banks are asset-based, so book value matters most.`]] },

'peg': { t:`PEG Ratio`, lv:'I', ff:`Price/Earnings to Growth Ratio`, al:[`PEG`,`PEG ratio`],
  s:`P/E divided by profit growth rate — checks if the P/E is fair for the growth.`,
  ex:[`A high P/E may be fine if profit grows very fast. PEG adjusts P/E for growth. Peter Lynch made it popular.`,
      `PEG around 1 is often seen as fair. Below 1 may be undervalued for its growth; above 2 may be expensive.`],
  f:`PEG = P/E ÷ Annual EPS Growth %`,
  tb:{h:[`Company`,`P/E`,`Growth`,`PEG`],r:[[`A`,`40`,`40%`,`1.0`],[`B`,`20`,`10%`,`2.0`]],c:`A has a higher P/E but is cheaper for its growth.`},
  use:[`Use realistic future growth, not one lucky year.`],
  mis:[`Using a one-time jump in profit as the growth rate.`],
  key:[`PEG ≈ 1 → fair.`,`< 1 → cheap for growth.`,`Growth estimate must be realistic.`],
  rel:['pe','growth','eps'],
  q:[[`P/E 30, growth 15%. PEG?`,[`0.5`,`2`,`45`],1,`30 ÷ 15 = 2.`]] },

'ev-ebitda': { t:`EV/EBITDA`, lv:'P', ff:`Enterprise Value to EBITDA`, al:[`EV/EBITDA`,`enterprise value`,`EV`],
  s:`Values the whole company (including debt) against its operating earnings — fair for comparing companies with different debt.`,
  ex:[`Enterprise Value (EV) is the cost to buy the entire business: market cap plus debt minus cash. P/E ignores debt; EV includes it.`,
      `Lower EV/EBITDA can mean cheaper. It is widely used for capital-heavy sectors like telecom, power, cement and metals.`],
  f:`EV = Market Cap + Total Debt − Cash\nEV/EBITDA = EV ÷ EBITDA`,
  eg:[`Market cap ₹8,000 cr, debt ₹3,000 cr, cash ₹1,000 cr → EV = ₹10,000 cr. EBITDA ₹1,250 cr → EV/EBITDA = 8.`],
  use:[`Compare with peers in the same industry.`],
  mis:[`Forgetting EBITDA ignores depreciation — for asset-heavy firms, that cost is real.`],
  key:[`EV includes debt, so it is fairer than P/E across debt levels.`,`Lower = cheaper (within the same industry).`],
  rel:['ebitda','pe','debt-equity'],
  q:[[`Market cap 500, debt 200, cash 100. EV?`,[`600`,`700`,`800`],0,`500 + 200 − 100 = 600.`]] },

'div-yield': { t:`Dividend Yield`, lv:'B', al:[`dividend yield`],
  s:`The yearly dividend as a % of the share price.`,
  ex:[`Dividend yield shows how much cash income you get each year for the price you pay, like interest on a deposit.`,
      `A high yield can be attractive, but check that the company can keep paying it. A yield jumps when the share price crashes — that may signal trouble, not a bargain.`],
  f:`Dividend Yield = Annual Dividend per Share ÷ Share Price × 100`,
  eg:[`Dividend ₹15 per year, share price ₹500 → yield = 3%.`],
  use:[`Look for steady dividends plus growing profits.`],
  mis:[`Chasing very high yield without checking the payout ratio and debt.`],
  key:[`Yield = dividend ÷ price.`,`A sudden high yield can be a warning.`],
  rel:['dividend','pe','fcf'],
  q:[[`Dividend ₹8, price ₹200. Yield?`,[`2%`,`4%`,`8%`],1,`8 ÷ 200 × 100 = 4%.`]] },

'roe': { t:`ROE`, lv:'B', ff:`Return on Equity`, al:[`ROE`,`return on equity`],
  s:`How much profit a company makes for every ₹100 of shareholders' money.`,
  ex:[`ROE measures how well management uses owners' money. ROE of 20% means ₹20 profit a year for every ₹100 of equity.`,
      `Good companies often keep ROE above 15% for many years. But ROE can be pushed up by heavy debt — so always check debt alongside it (or use ROCE).`],
  f:`ROE = Net Profit ÷ Shareholders' Equity × 100`,
  tb:{h:[`ROE`,`Meaning`],r:[[`Below 10%`,`Weak`],[`10 – 15%`,`Average`],[`15 – 25%`,`Good`],[`Above 25%`,`Excellent (check debt)`]]},
  eg:[`Net profit ₹180 crore, equity ₹1,000 crore → ROE = 18%.`],
  use:[`Check 5–10 year average ROE, not one year.`,`For banks, ROE is one of the most important ratios.`],
  mis:[`Praising high ROE that comes from high debt.`],
  key:[`ROE = profit ÷ equity.`,`15%+ steadily = good.`,`Check debt with it.`],
  rel:['roce','pb','debt-equity'],
  q:[[`Profit ₹50 cr, equity ₹250 cr. ROE?`,[`5%`,`20%`,`50%`],1,`50 ÷ 250 × 100 = 20%.`]] },

'roce': { t:`ROCE`, lv:'I', ff:`Return on Capital Employed`, al:[`ROCE`,`return on capital employed`,`capital employed`],
  s:`How much operating profit a company makes on all the money used in the business — both equity and debt.`,
  ex:[`ROCE is like ROE but includes borrowed money too, so debt can't fake it. It shows the true efficiency of the business.`,
      `A company with ROCE higher than its cost of borrowing creates value. Many top investors filter for ROCE above 15–20%. Use ROE for banks, and ROCE for most other companies.`],
  f:`ROCE = EBIT ÷ Capital Employed × 100\nCapital Employed = Total Assets − Current Liabilities\n(≈ Equity + Long-term Debt)`,
  eg:[`EBIT ₹300 crore, capital employed ₹1,500 crore → ROCE = 20%.`],
  use:[`Shortlist companies with ROCE above 15% for 5+ years.`,`Compare ROCE with peers in the same sector.`],
  mis:[`Using ROCE for banks — use ROE there.`],
  key:[`ROCE includes debt, so it's harder to fake.`,`15–20%+ consistently = quality business.`],
  rel:['roe','moat','margins'],
  q:[[`EBIT ₹120 cr, capital employed ₹600 cr. ROCE?`,[`12%`,`20%`,`50%`],1,`120 ÷ 600 × 100 = 20%.`],[`For a bank, which ratio is preferred?`,[`ROE`,`ROCE`],0,`For banks, ROE is the standard measure.`]] },

'margins': { t:`Profit Margins`, lv:'B', ff:`Operating Profit Margin (OPM) & Net Profit Margin`, al:[`OPM`,`operating margin`,`net margin`,`net profit margin`,`profit margin`,`margins`],
  s:`How many rupees of profit a company keeps from every ₹100 of sales.`,
  ex:[`Operating margin (OPM) shows profit from the core business before interest and tax. Net margin shows final profit after everything.`,
      `Rising margins mean the company is gaining pricing power or cutting costs. Falling margins often mean rising raw material costs or tougher competition. Margins vary a lot by industry — software has high margins, retail has thin ones.`],
  f:`Operating Margin = Operating Profit ÷ Revenue × 100\nNet Margin = Net Profit ÷ Revenue × 100`,
  eg:[`Revenue ₹1,000 cr, operating profit ₹200 cr, net profit ₹120 cr → OPM 20%, net margin 12%.`],
  use:[`Track margin trends quarter by quarter.`,`Compare with direct competitors.`],
  mis:[`Comparing margins of a software company with a supermarket.`],
  key:[`Margin = profit kept per ₹100 sales.`,`Stable or rising margins = strength.`],
  rel:['income-statement','ebitda','moat'],
  q:[[`Revenue ₹400 cr, net profit ₹40 cr. Net margin?`,[`4%`,`10%`,`40%`],1,`40 ÷ 400 × 100 = 10%.`]] },

'ebitda': { t:`EBITDA`, lv:'I', ff:`Earnings Before Interest, Taxes, Depreciation and Amortisation`, al:[`EBITDA`,`EBIT`,`operating profit`,`depreciation`],
  s:`Profit from the core business before interest, tax and depreciation are taken out.`,
  ex:[`EBITDA shows how much the main business earns before financing choices (interest), government (tax) and accounting wear-and-tear (depreciation). It makes companies with different debt and tax easier to compare.`,
      `EBIT is EBITDA minus depreciation. Be careful — EBITDA ignores real costs like replacing machines, so it can make heavy-asset businesses look better than they are.`],
  f:`EBITDA = Net Profit + Interest + Tax + Depreciation & Amortisation\nEBIT = EBITDA − Depreciation`,
  eg:[`Net profit 100, tax 35, interest 25, depreciation 40 → EBITDA = 200, EBIT = 160 (₹ crore).`],
  use:[`Used in EV/EBITDA and debt ratios like Debt/EBITDA.`],
  mis:[`Treating EBITDA as cash — it is not free cash flow.`],
  key:[`EBITDA = core earning power.`,`EBIT = after depreciation.`,`Not the same as cash.`],
  rel:['ev-ebitda','margins','fcf'],
  q:[[`Which is NOT removed before EBITDA?`,[`Interest`,`Depreciation`,`Raw material cost`],2,`Raw materials are an operating cost, already subtracted.`]] },

'debt-equity': { t:`Debt to Equity`, lv:'B', ff:`D/E Ratio`, al:[`debt to equity`,`D/E`,`debt`,`leverage ratio`,`borrowings`],
  s:`Shows how much the company has borrowed compared with shareholders' own money.`,
  ex:[`Debt is not always bad — it helps companies grow faster. But too much debt is dangerous: interest must be paid even in bad years.`,
      `D/E below 0.5 is usually comfortable for most companies. Banks and NBFCs naturally have high debt because lending is their business, so don't use this ratio for them.`],
  f:`Debt to Equity = Total Debt ÷ Shareholders' Equity`,
  tb:{h:[`D/E`,`Meaning`],r:[[`0`,`Debt-free`],[`Below 0.5`,`Safe`],[`0.5 – 1`,`Moderate`],[`Above 1`,`High — check interest coverage`]]},
  eg:[`Debt ₹400 crore, equity ₹1,000 crore → D/E = 0.4.`],
  use:[`Prefer low-debt companies in cyclical sectors (metals, real estate).`,`Watch the trend — rising debt with flat profit is a warning.`],
  mis:[`Applying D/E rules to banks.`],
  key:[`Lower D/E = safer.`,`Rising debt + falling profit = danger.`],
  rel:['interest-coverage','balance-sheet','roe'],
  q:[[`Debt ₹300 cr, equity ₹600 cr. D/E?`,[`0.5`,`2`,`3`],0,`300 ÷ 600 = 0.5.`]] },

'interest-coverage': { t:`Interest Coverage Ratio`, lv:'I', al:[`interest coverage`,`interest coverage ratio`,`ICR`],
  s:`How many times a company's operating profit can pay its yearly interest.`,
  ex:[`If operating profit is ₹100 and interest is ₹10, coverage is 10× — very safe. If it is close to 1×, almost all profit goes to lenders and any bad year can be dangerous.`],
  f:`Interest Coverage = EBIT ÷ Interest Expense`,
  tb:{h:[`Coverage`,`Safety`],r:[[`Above 5×`,`Comfortable`],[`2 – 5×`,`Okay`],[`Below 2×`,`Risky`],[`Below 1×`,`Cannot pay interest from profit`]]},
  eg:[`EBIT ₹240 crore, interest ₹40 crore → coverage = 6×.`],
  use:[`Check before buying any company with debt.`],
  mis:[`Looking at debt alone without checking if profit can service it.`],
  key:[`Higher = safer.`,`Below 2× = caution.`],
  rel:['debt-equity','ebitda'],
  q:[[`EBIT ₹90 cr, interest ₹30 cr. Coverage?`,[`3×`,`30×`,`0.3×`],0,`90 ÷ 30 = 3×.`]] },

'current-ratio': { t:`Current Ratio`, lv:'I', al:[`current ratio`,`current assets`,`current liabilities`,`working capital`],
  s:`Checks if a company has enough short-term assets to pay its short-term bills.`,
  ex:[`Current assets are things that turn into cash within a year (cash, receivables, inventory). Current liabilities are bills due within a year.`,
      `A current ratio above 1 means it can pay near-term bills. Around 1.5–2 is often comfortable. Too high can mean idle cash or stuck inventory.`],
  f:`Current Ratio = Current Assets ÷ Current Liabilities`,
  eg:[`Current assets ₹300 crore, current liabilities ₹200 crore → current ratio = 1.5.`],
  use:[`Useful for checking short-term survival, especially in small companies.`],
  mis:[`Ignoring what the current assets are — slow-moving inventory isn't really cash.`],
  key:[`> 1 = can pay short-term bills.`,`Check the quality of assets.`],
  rel:['balance-sheet','debt-equity','cash-flow'],
  q:[[`Current assets 150, current liabilities 100. Ratio?`,[`0.67`,`1.5`,`2.5`],1,`150 ÷ 100 = 1.5.`]] },

'growth': { t:`Sales & Profit Growth`, lv:'B', al:[`sales growth`,`profit growth`,`revenue growth`,`earnings growth`],
  s:`How fast a company's revenue and profit increase year after year.`,
  ex:[`Share prices follow profit growth in the long run. A company growing profit at 20% a year roughly doubles its profit in under 4 years.`,
      `Look at 3, 5 and 10-year compounded growth (CAGR), not just last year. The best sign is sales and profit growing together — profit growing much faster than sales for long is hard to keep up.`],
  f:`Growth % = (This Year − Last Year) ÷ Last Year × 100`,
  tb:{h:[`Growth rate`,`Profit doubles in about`],r:[[`10%`,`7.2 years`],[`15%`,`4.8 years`],[`20%`,`3.6 years`],[`25%`,`2.9 years`]],c:`Rule of 72: years to double ≈ 72 ÷ growth rate`},
  eg:[`Sales went from ₹500 crore to ₹600 crore → growth = 20%.`],
  use:[`Screen for 5-year sales and profit growth above 12–15%.`,`Check that growth is from the core business, not one-time gains.`],
  mis:[`Paying any price for growth — growth must be compared with valuation.`],
  key:[`Price follows profit growth over time.`,`Use multi-year CAGR.`,`Sales and profit should grow together.`],
  rel:['cagr-xirr','peg','income-statement'],
  q:[[`Profit grows 12% a year. It doubles in about…`,[`3 years`,`6 years`,`12 years`],1,`72 ÷ 12 = 6 years.`]] },

'promoter': { t:`Promoter Holding & Pledge`, lv:'I', al:[`promoter`,`promoters`,`promoter holding`,`pledge`,`pledged shares`,`shareholding pattern`],
  s:`How much of the company the founders/owners hold, and whether they have pledged those shares for loans.`,
  ex:[`Promoters are the founders or main owners. High and steady promoter holding shows they have "skin in the game".`,
      `Pledging means promoters have given their shares as security for a loan. If the share price falls, lenders may sell those shares, pushing the price down further. High pledging is a warning sign.`],
  tb:{h:[`Signal`,`Usually`],r:[[`Promoter holding rising`,`Positive — owners buying more`],[`Holding falling steadily`,`Check why they are selling`],[`High pledge (e.g. 30%+)`,`Red flag`],[`Pledge reducing`,`Positive`]]},
  eg:[`A company's promoters hold 60% but have pledged half of it. A 30% price fall could trigger forced selling by lenders.`],
  use:[`Check the shareholding pattern every quarter on Screener or the exchange website.`],
  mis:[`Ignoring pledged shares in small and mid caps.`],
  key:[`High promoter holding = alignment.`,`High pledge = risk of forced selling.`],
  rel:['fii-dii','fundamental-analysis','ipo'],
  q:[[`High promoter pledging is generally…`,[`A good sign`,`A warning sign`],1,`It can cause forced selling when prices fall.`]] },

'fii-dii': { t:`FII & DII Holding`, lv:'I', ff:`Foreign & Domestic Institutional Investors`, al:[`FII`,`FIIs`,`FPI`,`DII`,`DIIs`,`institutional investors`],
  s:`How much of a company is owned by big foreign and Indian institutions like funds, insurers and banks.`,
  ex:[`FIIs (now officially FPIs) are foreign funds investing in India. DIIs are Indian mutual funds, insurance companies like LIC, and banks.`,
      `Rising institutional holding often means professional research supports the company. Big FII selling or buying can move the whole market for days.`],
  eg:[`When FIIs sell heavily for weeks, Nifty often weakens — even when company results are fine. DIIs buying through SIP money often absorbs part of that selling.`],
  use:[`Track daily FII/DII cash data for market mood.`,`Check quarterly change in a company's FII/DII holding.`],
  mis:[`Blindly copying institutions — they also make mistakes and hold for different reasons.`],
  key:[`FII = foreign institutions. DII = Indian institutions.`,`Their flows move the market.`],
  rel:['promoter','mutual-fund','index'],
  q:[[`Indian mutual funds are…`,[`FIIs`,`DIIs`],1,`They are domestic institutional investors.`]] },

'fcf': { t:`Free Cash Flow`, lv:'I', ff:`FCF`, al:[`free cash flow`,`FCF`,`capex`,`capital expenditure`],
  s:`Cash left after a company pays for running the business and investing in new assets.`,
  ex:[`Free cash flow is the money the company can truly use — to pay dividends, buy back shares, repay debt or invest. Many investors trust FCF more than profit.`,
      `Capex (capital expenditure) is money spent on factories, machines and technology. Growing companies may have low FCF for a while because of heavy capex — that's okay if the investment earns good returns.`],
  f:`FCF = Operating Cash Flow − Capex`,
  eg:[`Operating cash flow ₹500 crore, capex ₹200 crore → FCF = ₹300 crore.`],
  use:[`Prefer companies with positive and growing FCF over many years.`,`FCF is the base of DCF valuation.`],
  mis:[`Punishing a fast-growing company for negative FCF without checking what the capex is building.`],
  key:[`FCF = cash after capex.`,`Funds dividends, buybacks, debt repayment.`,`Harder to fake than profit.`],
  rel:['cash-flow','dcf','dividend'],
  q:[[`Operating cash ₹150 cr, capex ₹60 cr. FCF?`,[`₹90 cr`,`₹210 cr`],0,`150 − 60 = ₹90 crore.`]] },

'dcf': { t:`DCF Valuation`, lv:'P', ff:`Discounted Cash Flow`, al:[`DCF`,`discounted cash flow`,`discount rate`,`terminal value`],
  s:`Values a company by adding up all its future cash flows, adjusted to today's money.`,
  ex:[`₹100 next year is worth less than ₹100 today, because today's money can earn interest. DCF "discounts" future cash flows back to today using a discount rate (often 10–14% in India).`,
      `Steps: (1) estimate free cash flow for the next 5–10 years, (2) estimate a terminal value for all years after that, (3) discount everything to today, (4) subtract debt, add cash, and divide by shares to get value per share.`,
      `DCF is powerful but very sensitive: a small change in growth or discount rate changes the answer a lot. Treat it as a range.`],
  f:`Present Value = Future Cash Flow ÷ (1 + r)ⁿ\nr = discount rate, n = years from now`,
  tb:{h:[`Year`,`FCF (₹ cr)`,`Discounted at 12%`],r:[[`1`,`100`,`89.3`],[`2`,`115`,`91.7`],[`3`,`132`,`94.0`]],c:`Each future year is worth less today. Example numbers.`},
  use:[`Run a "base", "good" and "bad" case to see a value range.`,`Use it mainly for stable cash-generating businesses.`],
  mis:[`Using very high growth for too many years.`,`Trusting one exact DCF number.`],
  key:[`Future cash, discounted to today.`,`Very sensitive to assumptions.`,`Use with a margin of safety.`],
  rel:['fcf','intrinsic-value','pe'],
  q:[[`Why is future money discounted?`,[`Because of tax`,`Because money today can earn returns`],1,`Time value of money — money today is worth more.`]] }
});

// ===== Technical Analysis =====
Object.assign(C, {
'technical-analysis': { t:`What is Technical Analysis`, lv:'B', al:[`technical analysis`,`TA`],
  s:`Studying price charts and volume to predict where price may go next.`,
  ex:[`Technical analysis believes that price already reflects all news, and that people behave in repeating ways — so patterns repeat. Instead of asking "is this a good company?", it asks "when should I buy or sell?"`,
      `Main tools: trend, support and resistance, chart patterns, candlesticks and indicators. It works on any market — stocks, crypto, forex, commodities — and any timeframe.`],
  tb:{h:[``,`Fundamental`,`Technical`],r:[[`Question`,`What to buy?`,`When to buy?`],[`Looks at`,`Business, financials`,`Price, volume, charts`],[`Time frame`,`Months – years`,`Minutes – months`],[`Used by`,`Investors`,`Traders`]]},
  eg:[`A trader sees Bitcoin bounce three times from the same price level (support) and buys the next time it reaches there, with a stop just below.`],
  use:[`Combine with risk management — no setup works every time.`,`Many investors use fundamentals to pick and technicals to time.`],
  mis:[`Adding too many indicators until the chart is confusing.`,`Believing any pattern is 100% sure.`],
  key:[`Price discounts everything.`,`History tends to repeat.`,`It's about probabilities, not certainty.`],
  rel:['chart-types','trend','sr','fundamental-analysis'],
  q:[[`Technical analysis mainly answers…`,[`What to buy`,`When to buy or sell`],1,`It focuses on timing using price and volume.`]] },

'chart-types': { t:`Line, Bar & Candle Charts`, lv:'B', al:[`line chart`,`bar chart`,`candlestick chart`,`chart types`,`Heikin Ashi`],
  s:`Different ways to draw price on a chart. Candlestick charts are the most popular with traders.`,
  ex:[`A **line chart** joins closing prices — clean, good for the big picture. A **bar chart (OHLC)** shows open, high, low and close for each period. A **candlestick chart** shows the same four prices, but with a coloured body that makes buying and selling pressure easy to see.`,
      `Other types like Heikin Ashi smooth out candles to show trend more clearly, but they don't show the real prices.`],
  dg:'candle', dgc:`One candle = open, high, low and close of one period`,
  tb:{h:[`Chart`,`Shows`,`Best for`],r:[[`Line`,`Close only`,`Big-picture trend`],[`Bar (OHLC)`,`Open, High, Low, Close`,`Detailed analysis`],[`Candlestick`,`OHLC with coloured body`,`Most trading`],[`Heikin Ashi`,`Averaged candles`,`Seeing trend, not exact prices`]]},
  use:[`Use candlesticks for trading; switch to line charts to see major levels without noise.`],
  mis:[`Placing exact entries and stops on Heikin Ashi charts — its prices aren't real.`],
  key:[`OHLC = Open, High, Low, Close.`,`Candlestick is the standard for traders.`],
  rel:['candlestick','timeframes','technical-analysis'],
  q:[[`What does OHLC stand for?`,[`Open, High, Low, Close`,`Order, Hold, Limit, Cancel`],0,`The four key prices of a period.`]] },

'timeframes': { t:`Timeframes`, lv:'B', al:[`timeframe`,`timeframes`,`multi-timeframe`,`higher timeframe`,`lower timeframe`],
  s:`How much time each candle on the chart represents — 1 minute, 15 minutes, 1 day, 1 week and so on.`,
  ex:[`On a 15-minute chart, each candle shows 15 minutes of trading. On a daily chart, each candle is one full day. Higher timeframes show the big trend; lower timeframes show exact entry points.`,
      `**Multi-timeframe analysis**: check the trend on a higher timeframe, then look for an entry on a lower one. A common rule is to use a ratio of about 4–6× between them.`],
  tb:{h:[`Trading style`,`Trend timeframe`,`Entry timeframe`],r:[[`Scalping`,`15 min`,`1 – 3 min`],[`Intraday`,`1 hour`,`5 – 15 min`],[`Swing`,`Daily`,`1 hour – 4 hour`],[`Positional`,`Weekly`,`Daily`]]},
  eg:[`Daily chart of Nifty is in an uptrend. On the 15-minute chart you wait for a pullback to support, then buy in the direction of the daily trend.`],
  use:[`Always trade in the direction of the higher-timeframe trend.`],
