// ===== Dictionary app =====
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const LV = { B: 'Beginner', I: 'Intermediate', P: 'Pro' };
  const showFF = (n) => n.ff && !n.t.toLowerCase().includes(String(n.ff).toLowerCase());

  // ---------- Build tree ----------
  const N = {}, LEAVES = [];
  const ROOT = { id: '__root', t: 'Library', kids: [], leaf: false };
  (function walk(list, parent) {
    list.forEach(x => {
      let n;
      if (typeof x === 'string') {
        const c = C[x]; if (!c) { console.warn('Missing topic', x); return; }
        n = Object.assign({ id: x, leaf: true }, c); LEAVES.push(n);
      } else n = { id: x.id, t: x.t, d: x.d, ic: x.ic, leaf: false, kids: [] };
      n.parent = parent; N[n.id] = n; parent.kids.push(n);
      if (!n.leaf) walk(x.ch, n);
    });
  })(TREE, ROOT);
  const cnt = {}; const count = (n) => n.leaf ? 1 : (cnt[n.id] ??= n.kids.reduce((s, k) => s + count(k), 0));

  // ---------- Storage (device only) ----------
  const KEY = 'jsr-dictionary-v1';
  let S = { bm: [], rc: [], ln: [], snd: true };
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) S = Object.assign(S, v); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const learnedIn = (n) => n.leaf ? (S.ln.includes(n.id) ? 1 : 0) : n.kids.reduce((s, k) => s + learnedIn(k), 0);

  // ---------- Soft tap sound ----------
  let AC;
  function tap() {
    if (!S.snd) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(540, t + .07);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.045, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + .1);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .12);
    } catch (e) {}
  }

  // ---------- Tap-a-word links ----------
  const TERM = new Map(); let LINKRE = null;
  (function () {
    const terms = [];
    LEAVES.forEach(n => (n.al || []).forEach(a => { const k = a.toLowerCase(); if (!TERM.has(k)) { TERM.set(k, { id: n.id, exact: /^[A-Z0-9&\/\-]{2,6}$/.test(a) ? a : null }); terms.push(a); } }));
    terms.sort((a, b) => b.length - a.length);
    const body = terms.map(t => t.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&')).join('|');
    try { LINKRE = new RegExp('(?<![A-Za-z0-9])(' + body + ')(?![A-Za-z0-9])', 'gi'); }
    catch (e) { LINKRE = new RegExp('\\b(' + body + ')\\b', 'gi'); }
  })();
  function rich(text, ctx) {
    text = String(text); let out = '', last = 0;
    if (LINKRE) text.replace(LINKRE, (m, g, off) => {
      out += esc(text.slice(last, off));
      const tm = TERM.get(m.toLowerCase()), id = tm && (!tm.exact || tm.exact === m) ? tm.id : null;
      if (id && id !== ctx.self && !ctx.used.has(id) && ctx.used.size < 16) { ctx.used.add(id); out += `<span class="tw" data-t="${id}">${esc(m)}</span>`; }
      else out += esc(m);
      last = off + m.length; return m;
    });
    out += esc(text.slice(last));
    return out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }

  // ---------- Navigation ----------
  let cur = 'home', hist = [], libTab = 'bm';
  const wide = () => matchMedia('(min-width: 900px)').matches;
  function go(id) {
    if (id === cur) return;
    if (id === 'home') { hist = []; cur = 'home'; render('b'); return; }
    hist.push(cur); cur = id;
    const n = N[cur]; if (n && n.leaf) { S.rc = [cur, ...S.rc.filter(x => x !== cur)].slice(0, 25); save(); }
    render('f');
  }
  function back() { if (cur === 'home') return; cur = hist.pop() || 'home'; render('b'); }

  function render(dir) {

  function view() {
    if (cur === 'home') return home();
    if (cur === 'library') return library();
    const n = N[cur]; if (!n) { cur = 'home'; return home(); }
    return n.leaf ? page(n) : folder(n);
  }

  // ---------- Pieces ----------
  function row(k, o = {}) {
    let sub = '', meta = '';
    if (k.leaf) { sub = k.s; if (S.ln.includes(k.id)) meta = `<span class="done">${ic('check')}</span>`; }
    else { const tot = count(k), l = learnedIn(k); sub = k.d || ''; meta = tot ? `<span class="cnt">${l ? l + '/' : ''}${tot}</span>` : `<span class="soon">Soon</span>`; }
    return `<button class="row${o.active ? ' act' : ''}${o.cpt ? ' cpt' : ''}" data-go="${k.id}">` +
      (k.ic ? `<span class="ic">${ic(k.ic)}</span>` : '') +
      `<span class="tx"><span class="t">${esc(k.t)}${k.leaf && !o.cpt ? `<i class="lvt">${LV[k.lv] || ''}</i>` : ''}</span>` +
      (sub && !o.nosub ? `<span class="sub">${esc(sub)}</span>` : '') + `</span>${meta}<span class="chev">${ic('chev')}</span></button>`;
  }
  const list = (arr, o) => `<div class="list">${arr.map(k => row(k, o)).join('')}</div>`;
  function crumbs(n) {
    const a = []; let p = n.parent; while (p && p !== ROOT) { a.unshift(p); p = p.parent; }
    return `<nav class="crumbs"><button data-go="home">Home</button>${a.map(x => `<span class="sep">›</span><button data-go="${x.id}">${esc(x.t)}</button>`).join('')}</nav>`;
  }
  function pathText(n) { const a = []; let p = n.parent; while (p && p !== ROOT) { a.unshift(p.t); p = p.parent; } return a.join(' › '); }
  const sec = (title, inner, cls = '') => `<section class="sec ${cls}"><h3>${title}</h3>${inner}</section>`;
  const ul = (arr, R, cls = 'k') => `<ul class="${cls}">${arr.map(x => `<li>${R(x)}</li>`).join('')}</ul>`;
  function table(tb, R) {

  }

  function wordOfDay() {
    const d = new Date(), day = Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
    return LEAVES[(day * 37) % LEAVES.length];
  }

  // ---------- Screens ----------
  function home() {
    const w = wordOfDay(), rec = S.rc.slice(0, 3).map(id => N[id]).filter(Boolean);
    return `<div class="home">
      <h1 class="big">Dictionary</h1>
      <button class="sbar" data-act="search">${ic('search')}<span>Search — EBITDA, RSI, P/E, SIP…</span></button>
      <div class="wod" data-go="${w.id}" role="button">
        <div class="wl">${ic('spark')}<span>Word of the day</span></div>
        <div class="wt">${esc(w.t)}</div>${showFF(w) ? `<div class="wf">${esc(w.ff)}</div>` : ''}
        <div class="ws">${esc(w.s)}</div>
        <div class="wr"><span>${esc(pathText(w))}</span><b>Read ${ic('arrow')}</b></div>
      </div>
      <button class="rnd" data-act="random"><span class="ic">${ic('dice')}</span><span class="tx"><span class="t">Random topic</span><span class="sub">Open a surprise topic and learn something new</span></span><span class="chev">${ic('chev')}</span></button>
      ${rec.length ? `<h3 class="lab">Continue reading</h3>${list(rec, { nosub: false })}` : ''}
      <h3 class="lab only-narrow">Subjects</h3><div class="only-narrow">${list(ROOT.kids)}</div>
      ${wide() ? `<h3 class="lab">Start here</h3>${list(['stock-market', 'fundamental-analysis', 'technical-analysis', 'risk-management'].map(id => N[id]).filter(Boolean))}` : ''}
      <p class="foot">${LEAVES.length} topics · Stock Market ready · more subjects coming</p>
    </div>`;
  }

  function folder(n) {
    const tot = count(n), l = learnedIn(n);
    return crumbs(n) + `<header class="fh">${n.ic ? `<span class="fic">${ic(n.ic)}</span>` : ''}<h1 class="pt">${esc(n.t)}</h1>
      ${n.d ? `<p class="fd">${esc(n.d)}</p>` : ''}${tot ? `<p class="fm">${tot} topics${l ? ` · ${l} learned` : ''}</p>` : ''}</header>` +
      (n.kids.length ? list(n.kids) :
        `<div class="soonbox">${ic('book')}<h3>Coming in the next update</h3><p>Topics for ${esc(n.t)} are being written. Ask for this section and it will be added to this same app.</p></div>`);
  }

  function page(n) {
    const ctx = { self: n.id, used: new Set() }, R = t => rich(t, ctx);
    const bm = S.bm.includes(n.id), ln = S.ln.includes(n.id);
    let h = crumbs(n) + `<article class="pg">
      <div class="lvl">${LV[n.lv] || ''}</div>
      <h1 class="pt">${esc(n.t)}</h1>${showFF(n) ? `<p class="ff">${esc(n.ff)}</p>` : ''}
      <div class="acts">
        <button class="act${bm ? ' on' : ''}" data-act="bm">${ic('bookmark')}<span>${bm ? 'Saved' : 'Save'}</span></button>
        <button class="act${ln ? ' on' : ''}" data-act="ln">${ic('check')}<span>${ln ? 'Learned' : 'Mark learned'}</span></button>
        ${n.q && n.q.length ? `<button class="act" data-act="quiz">${ic('quiz')}<span>Quiz</span></button>` : ''}

    if (n.dg) h += `<figure class="dg">${DG(n.dg)}${n.dgc ? `<figcaption>${esc(n.dgc)}</figcaption>` : ''}</figure>`;
    if (n.tb) h += table(n.tb, R);

  function closeSheet() { sheet.classList.remove('on'); }
  function openTerm(id) {

    openSheet(`<div class="lvl">${LV[n.lv] || ''}</div><h2 class="sh">${esc(n.t)}</h2>${showFF(n) ? `<p class="ff">${esc(n.ff)}</p>` : ''}<p class="ss">${esc(n.s)}</p><p class="sp">${esc(pathText(n))}</p><button class="open" data-go="${id}">Open full topic ${ic('arrow')}</button>`);
  }

    const sc = [];
    ALL.forEach(n => {
      const t = n.t.toLowerCase(); let s = 0;

      (n.al || []).forEach(a => { a = a.toLowerCase(); if (a === q) s = Math.max(s, 95); else if (a.startsWith(q)) s = Math.max(s, 70); else if (a.includes(q)) s = Math.max(s, 45); });

      if (!s && n.s && n.s.toLowerCase().includes(q)) s = 20;
      if (!s && n.d && n.d.toLowerCase().includes(q)) s = 15;
      if (s) sc.push([s + (n.leaf ? 1 : 0), n]);
    });
    sc.sort((a, b) => b[0] - a[0]);
    QR.innerHTML = sc.length ? `<div class="list">${sc.slice(0, 40).map(([, n]) =>
      `<button class="row" data-go="${n.id}"><span class="tx"><span class="t">${esc(n.t)}</span><span class="sub">${esc(pathText(n) || 'Subject')}${n.s ? ' — ' + esc(n.s) : ''}</span></span><span class="chev">${ic('chev')}</span></button>`).join('')}</div>`
      : `<p class="hint">No topic found for “${esc(QI.value)}”. More topics are coming in future updates.</p>`;
  }
  QI.addEventListener('input', doSearch);
  QI.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('.row', QR); if (f) f.click(); } if (e.key === 'Escape') closeSearch(); });

  // ---------- Clicks ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-act],.tw,[data-fill],.sbg,#qx,#back,#bSearch,#bLib');
    if (!t) return;
    tap();
    if (t.id === 'back') return back();
    if (t.id === 'bSearch') return openSearch();
    if (t.id === 'bLib') return go('library');
    if (t.id === 'qx') return closeSearch();
    if (t.classList.contains('sbg')) return closeSheet();
    if (t.classList.contains('tw')) return openTerm(t.dataset.t);
    if (t.dataset.fill) { QI.value = t.dataset.fill; doSearch(); return; }
    if (t.dataset.go) { closeSheet(); closeSearch(); return go(t.dataset.go); }
    const a = t.dataset.act;
    if (a === 'search') openSearch();
    else if (a === 'random') { let r; do { r = LEAVES[Math.floor(Math.random() * LEAVES.length)]; } while (r.id === cur && LEAVES.length > 1); go(r.id); }
    else if (a === 'bm' || a === 'ln') {
      const arr = S[a], on = !arr.includes(cur);
      S[a] = on ? [cur, ...arr] : arr.filter(x => x !== cur); save();
      t.classList.toggle('on', on); $('span', t).textContent = a === 'bm' ? (on ? 'Saved' : 'Save') : (on ? 'Learned' : 'Mark learned');
      if (on) { t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); }
      renderLeft();
    }
    else if (a === 'quiz') openQuiz(cur);
    else if (a === 'qa') answer(+t.dataset.q, +t.dataset.o);
    else if (a === 'tab') { libTab = t.dataset.k; $('#view').innerHTML = library(); }
    else if (a === 'snd') { S.snd = !S.snd; save(); $('.tog', t).classList.toggle('on', S.snd); if (S.snd) tap(); }
  });

  // ---------- Swipe back + swipe sheet down ----------
  let sx = null, sy = 0, st = 0;
  const M = $('#main');
  M.addEventListener('touchstart', e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; st = Date.now(); if (e.target.closest('.tbl')) sx = null; }, { passive: true });
  M.addEventListener('touchend', e => {
    if (sx == null) return; const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
    if (dx > 80 && Math.abs(dy) < 60 && Date.now() - st < 700 && cur !== 'home') { tap(); back(); }
    sx = null;
  }, { passive: true });
  let cy = null;
  card.addEventListener('touchstart', e => { cy = card.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  card.addEventListener('touchend', e => { if (cy != null && e.changedTouches[0].clientY - cy > 90) closeSheet(); cy = null; }, { passive: true });

  // ---------- Opening animation ----------
  const SP = $('#splash'); let spT;
  (function () {
    const p = $('#sp-path'); try { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; } catch (e) {}
    const t = $('.sp-title'); t.innerHTML = 'Dictionary'.split('').map((c, i) => `<span style="animation-delay:${(.62 + i * .05).toFixed(2)}s">${c}</span>`).join('');
  })();
  function playSplash() {
    SP.classList.remove('hide', 'run'); void SP.offsetWidth; SP.classList.add('run');
    clearTimeout(spT); spT = setTimeout(hideSplash, 2100);
  }
  function hideSplash() { SP.classList.add('hide'); document.body.classList.add('ready'); }
  SP.addEventListener('click', hideSplash);
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 120000) { closeSheet(); closeSearch(); playSplash(); }
  });

  // ---------- Start ----------
  let wasWide = wide();
  addEventListener('resize', () => { if (wide() !== wasWide) { wasWide = wide(); render(null); } });
  render(null);
  playSplash();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
